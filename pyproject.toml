[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legged-studio"
version = "0.55.23"
description = "Legged Robot RL Studio - Full-stack tool for training, evaluation, and deployment"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12, <3.13"
authors = [
    { name = "zeitvex" }
]
keywords = ["robotics", "reinforcement-learning", "legged-robot", "quadruped"]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "pydantic>=2.0.0",
    "numpy>=2.0,<3",
    "mujoco==3.11.0",
]

[project.optional-dependencies]
# Training/evaluation stacks live in adapters/* and are never installed into
# the control-plane environment.
dev = [
    "pytest>=7.0.0",
    "httpx>=0.27.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/zeitvex/legged-studio"
Repository = "https://github.com/zeitvex/legged-studio"

[tool.hatch.build.targets.wheel]
packages = ["backend", "contracts"]

# 运行时数据目录：backend 以 `Path(__file__).parents[1]/<dir>` 解析，因此必须随包
# 一起进 wheel（Electron 侧由 package.json 的 extraResources 同口径携带）。
# 漏掉任一项的后果不是报错而是"运行时读不到"——registry 缺失会让档案页与
# 档位接口 500，packs 缺失会让 /api/packs 空表。
[tool.hatch.build.targets.wheel.force-include]
"registry" = "registry"
"packs" = "packs"

# Playwright E2E 默认不随单元测试跑（需要浏览器 + 真实后端）。
# 跑法：pytest tests/e2e -v  （依赖根 Dockerfile 或 requirements-dev.txt）
[tool.pytest.ini_options]
testpaths = ["tests/e2e"]
markers = ["e2e: 浏览器端到端测试（需 playwright install chromium）"]
addopts = "-p no:cacheprovider"
