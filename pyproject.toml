[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legged-studio"
version = "0.51.0"
description = "Legged Robot RL Studio - Full-stack tool for training, evaluation, and deployment"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12, <3.13"
authors = [
    { name = "zeitvex" }
]
keywords = ["robotics", "reinforcement-learning", "legged-robot", "quadruped"]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "pydantic>=2.0.0",
    "numpy>=2.0,<3",
    "mujoco==3.11.0",
]

[project.optional-dependencies]
# Training/evaluation stacks live in adapters/* and are never installed into
# the control-plane environment.
dev = [
    "pytest>=7.0.0",
    "httpx>=0.27.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/zeitvex/legged-studio"
Repository = "https://github.com/zeitvex/legged-studio"

[tool.hatch.build.targets.wheel]
packages = ["backend", "contracts"]

# Playwright E2E 默认不随单元测试跑（需要浏览器 + 真实后端）。
# 跑法：pytest tests/e2e -v  （依赖 .ide/Dockerfile 或 requirements-dev.txt）
[tool.pytest.ini_options]
testpaths = ["tests/e2e"]
markers = ["e2e: 浏览器端到端测试（需 playwright install chromium）"]
addopts = "-p no:cacheprovider"
