# 环境镜像：**一律用 CNB 默认镜像**（.cnb.yml 里不写 docker.image / docker.build）。
#
# 为什么不再用根 Dockerfile 自建（2026-09-22 指令「不要用自定义的，有很多问题」）：
# 自建镜像把「控制面依赖 + Chromium + code-server + 训练栈」全固化进层里，换来的是
# 一长串只有自建镜像才有的问题——code-server 单/双容器判定、CodeBuddy 插件要手动补装、
# 基础镜像 apt 包名随发行版迁移（bookworm→noble 已踩过一次）、每次改 by 清单就整体重建。
# 默认镜像 cnbcool/default-dev-env 本身就是单容器 + WebIDE + CodeBuddy（含插件）齐备，
# 平台侧维护，上述问题面直接消失。
#
# 依赖改由**环境启动时按需供应**（.dev-env-bootstrap 锚点，幂等）：
# 控制面 pip 依赖 / 训练 venv 在启动时供应，不在镜像层固化。

# ───────────────────────────────────────────────────────────────────────────
# CI 资源规模：**不声明 `runner.cpus`**，一律吃平台默认（8 核 / 16 GiB）。
#
# 来龙去脉（2026-09-22，同一件事来回走了三趟，这里一次写清，避免再改回去）：
#   1. PR #46/#47 期间，根组织的「云原生构建-CPU」月度额度（免费 160 核时/月）
#      见底，而 Prepare 阶段按 `cpus × 5min` 从根组织**预冻结**核时，额度不足
#      直接驳回、一条 stage 都不跑；报错落点却在 stage 链第一段（依赖安装），
#      看着像"依赖装不上"，实际与依赖无关。当时把 `cpus` 一路降到平台下限 1 核
#      （0.08 核时/次冻结），并把 PR 事件上的门禁整段摘掉。
#   2. 额度恢复后，1 核这个"地板价"就没有存在理由了：它是**为躲临时额度**设的，
#      不是任何一条门禁的真实资源需求。1 核会让单测 / 训练冒烟 / 无头验收这类
#      本来就吃 CPU 的 stage 变成长板，墙钟明显变慢。
#   3. 现在按「配置回到平台默认」处理：删掉全部 `cpus` 声明。
#
# 两个必须记住的点：
#   - **不写 `cpus` = 8 核，不是"不花额度"**（构建日志会打印
#     `Pipeline actual limit cpus: 8`）。额度是按 `cpus × 5min` 预冻结的，
#     留空就是按 8 核的单价冻结（0.67 核时/次）。若某天门禁又在 Prepare 被
#     驳回，报错形如：
#       Root Group's events CPU core-hours are insufficient for pre-freezing
#       (Freezing time: 5.00 min, equivalent to 0.67 core-hours)   # 8 核
#     处置顺序应是**先找根组织管理员提额**，再考虑临时降核；不要再把降核
#     当成常规手段——它治不了额度见底，只把"被驳"的时机往后挪（降核 + 串行
#     都试过，1 核仍被驳，见 PR #47/#48 的实测）。
#   - **内存不是独立字段**，是平台的固定公式 `cpus × 2 GB`，所以 `2 GiB` 与
#     `1 核` 是同一件事的两种描述；`.cnb.yml` 里根本没有 `memory` 字段。
#
# 云原生开发按钮的核数在 `.cnb/settings.yml`（现 8 核，扣的是「云原生开发-CPU」
# 额度，1600 核时/月，与构建配额不是一本账），也不属于本次回退范围。
# ───────────────────────────────────────────────────────────────────────────

# 环境供应的公共锚点：默认镜像只有 Python/Node 运行时，控制面依赖与训练栈
# 都**不预装**（见 .dev-env-bootstrap 的注释）。CI 与云原生开发共用这一段，
# 保证「开发环境里跑通的」和「CI 里跑的」仍是同一套依赖。
#
# 注意锚点形态：这必须是**单个 stage 的映射**（不是 list）。若写成 list 再以
# `- *dev-env-bootstrap` 引用，YAML 会展开成嵌套 list（stages[0][0]），
# CNB 不认嵌套结构，stage 会被整体跳过。引用方一律用合并键 `- <<: *anchor`。
#
# 为什么 CI 不缓存、每次装：runner 上都是几分钟量级，
# 好处是**依赖版本零漂移**——backend/requirements.txt 改一行立刻生效，不存在
# 「镜像层还是旧依赖」的滞后。装不上的失败会直接暴露在门禁里，不会静默降级。
.dev-env-bootstrap: &dev-env-bootstrap
  name: dev-env-bootstrap
  script: |
    # 幂等：已装好就跳过（开发环境里每次起环境都会走到这里）。
    # 这里刻意**不用 pipefail**：stage.script 由 sh 解释，dash 的 `set -o pipefail`
    # 会直接报 "Illegal option" 并让门禁在开局就退出（本仓曾因此 167ms 判失败）。
    # 也不依赖 python3/pip 预装：下方**自举**，见「解释器与包管理器」段。
    set -e
    echo "== 解释器与包管理器（底座不保证预装，自举） =="
    # 本锚点挂在 cpu-training-smoke(-pr) 的 stage 链首。曾有一段时期
    # `.cpu-training-env` 只声明 `runner.cpus`、**不声明 docker.image**，
    # 于是它跑在平台默认 runner 上 —— 那里既没有 python3 也没有 pip：
    #
    #   == control-plane deps ==
    #   sh: line 7: pip: command not found
    #   sh: line 9: python3: command not found
    #   [FAIL] 控制面依赖供应失败        （stage 在 150ms 内判 error）
    #
    # 现在 `.cpu-training-env` 已补上 `docker.image: python:3.12`，但**这段自举仍然保留**：
    # 同一条锚点也被 vscode 段（无 image 底座的平台默认开发环境）复用，且它是
    # 「开发环境能起 = CI 也能起」的同一份口径。自举逻辑：优先复用镜像自带的
    # python3，缺失时按发行版装上（apt 版 python3 自带 ensurepip/pip）。
    if ! command -v python3 >/dev/null 2>&1; then
      echo "底座无 python3：按发行版安装"
      if command -v apt-get >/dev/null 2>&1; then
        export DEBIAN_FRONTEND=noninteractive
        apt-get update -qq
        apt-get install -y -qq python3 python3-pip python3-venv
      elif command -v apk >/dev/null 2>&1; then
        apk add --no-cache python3 py3-pip python3-dev
      elif command -v dnf >/dev/null 2>&1; then
        dnf install -y -q python3 python3-pip
      elif command -v yum >/dev/null 2>&1; then
        yum install -y -q python3 python3-pip
      fi
    else
      command -v pip >/dev/null 2>&1 \
        || python3 -m ensurepip --upgrade >/dev/null 2>&1 \
        || true
    fi
    command -v python3 >/dev/null 2>&1 \
      || { echo "[FAIL] 无法获得 python3（默认 runner 未预装，且 apt/apk/dnf/yum 均不可用）"; exit 1; }
    python3 --version
    echo "== control-plane deps =="
    python3 -c "import fastapi, uvicorn, pydantic, numpy, mujoco" 2>/dev/null \
      || python3 -m pip install --quiet --break-system-packages \
           -r backend/requirements.txt httpx onnx onnxruntime 2>&1 | tail -5
    python3 -c "import fastapi, uvicorn, pydantic, numpy, mujoco" \
      || { echo "[FAIL] 控制面依赖供应失败"; exit 1; }
    echo "== offscreen GL backend (best-effort, never fatal) =="
    # 无显示环境下离屏渲染需要软件 GL（libOSMesa）；装不上不判红——
    # backend/gl_env.offscreen_render_status() 是实测探针，不可用时用例自我 skip。
    (apt-get update -qq && apt-get install -y -qq libosmesa6) \
      || echo "libosmesa6 安装失败：渲染用例将 skip"
    echo "== CPU training venv (idempotent) =="
    # 默认镜像不预装 torch/mjlab；用适配器的 cpu extra 供应到仓库外的落点
    # （避免被 bind mount 覆盖），已就绪时脚本自身短路复用。
    #
    # 这里**不再写死** LEGGED_STUDIO_UV_BIN：CI 底座是 python:3.12（无 uv），
    # 写死 /usr/local/bin/uv 会让 provision 脚本在第 3 步 127
    # （`/usr/local/bin/uv: No such file or directory`，实测于构建 cnb-p9g-1k33d6d1m-003）。
    # 让脚本自己「PATH 探测 → 缺失则按 UV_VERSION 安装」即可，两处落点口径一致。
    bash scripts/provision_cpu_training.sh


# ───────────────────────────────────────────────────────────────────────────
# 语法门禁（**不装任何 pip 包**）
#
# 这一步只跑 py_compile 与契约产物漂移检查，不需要成堆第三方包，因此：
#   - 单独成 pipeline，与 unit-tests **并发**（push 墙钟 ≈ max 而不是串行和）；
#   - 不声明 `runner.cpus`，吃平台默认 8 核（依据见文件头「CI 资源规模」注）。
#
# 仍声明 `docker.image: python:3.12`：**CI runner 的默认镜像没有 python**
# （实测 `python` / `python3` 均 127），无镜像声明跑不起来；而 python:3.12
# 与云原生开发的默认镜像同版。它只是**运行底座**，不装依赖，因此没有
# "镜像层里是旧依赖"的漂移面。
# ───────────────────────────────────────────────────────────────────────────
syntax-check: &syntax-check
  name: syntax-check
  docker:
    image: python:3.12
  stages:
  - name: syntax-check
    script: |
      set -eo pipefail
      echo "== py_compile changed python =="
      # 排除 .venv / node_modules：训练 venv 里是第三方轮子（可能是 3.12+ 语法），
      # 不该由本仓库的语法检查负责。
      # K2：范围由 adapters/mjlab 改为整个 adapters/ —— 顶层 adapters/backend_adapter.py
      # 是控制面直接 import 的（backend/training/models.py 引它），此前不在语法检查内。
      find backend contracts adapters tools scripts -name '*.py' \
        -not -path '*/.venv/*' -not -path '*/node_modules/*' -print0 \
        | xargs -0 -n1 python -m py_compile 2>&1 | tail -20
      echo "python syntax check done"
      echo "== contract artifact drift check =="
      python tools/generate_contract_models.py 2>&1 | tail -20

# ───────────────────────────────────────────────────────────────────────────
# 后端单测与审计门禁（需要解释器 + pip）
#
# 唯一保留 docker.image 的地方：默认 runner 环境没有 python/pip，命令会直接 127。
# 与默认镜像同版的 python:3.12 只是**运行底座**，依赖仍由 stage 现装
# （backend/requirements.txt），因此不引入「镜像层里是旧依赖」的漂移面。
# ───────────────────────────────────────────────────────────────────────────
.main-env: &main-env
  docker:
    image: python:3.12
  stages:
  - name: unit-tests
    script: |
      set -eo pipefail
      echo "== install control-plane deps =="
      # 本 pipeline 有 python:3.12 底座，`pip` / `python` 都在 PATH 上；容器无 venv
      # （该镜像不带 venv 模块），故用 `--break-system-packages` 直装系统 site-packages。
      python -m pip install --quiet --upgrade pip || true
      # 与 backend/requirements.txt 保持一致；httpx 是 starlette TestClient 依赖；
      # onnx 是 B44「产物自证」的量具（读 ONNX 图输入宽度）——不装它那组用例会 skip，
      # 而 verify_artifacts 会静默退化成快照 fallback（B44 要挡的正是这种错配）。
      python -m pip install --quiet --break-system-packages -r backend/requirements.txt httpx onnx
      echo "== offscreen GL backend (best-effort, never fatal) =="
      # 无显示环境下离屏渲染需要**软件 GL**（libOSMesa）。这里尽力装：
      # 装不上也不判红——backend/gl_env.offscreen_render_status() 是**实测探针**
      # （真建 Renderer 渲一帧），不可用时对应用例自我 skip，不会把环境问题报成失败。
      (apt-get update -qq && apt-get install -y -qq libosmesa6) || echo "libosmesa6 安装失败：渲染用例将 skip"
      echo "== node runtime (观测对拍链的回归锁依赖它) =="
      # `backend/test_obs_crosscheck_harness.py` 会**真跑** `tools/obs_crosscheck.py`
      # （它再驱动 `web/sim2sim/obs/*.js` 的浏览器侧构建器）。本镜像是 `python:3.12`，
      # **不带 node** ⇒ 缺了它那组用例原地 `skipUnless(node)` ⇒ **门禁形同不存在**
      # （这正是"工具静默失效"的形态：CI 全绿，而链子从没被检查过）。
      # 与 libosmesa6 同口径：best-effort，装不上就如实 skip（不把环境问题报成失败，
      # 也不假装在守）。
      (apt-get install -y -qq nodejs) || echo "nodejs 安装失败：观测对拍链回归锁将 skip"
      echo "== path_bootstrap tests =="
      python -m unittest contracts.tests.test_path_bootstrap 2>&1 | tail -20
      echo "== pure-logic backend tests =="
      python -m unittest \
        backend.test_nav_avoidance \
        backend.test_map_editor_api \
        backend.test_perception_observations \
        backend.test_hygiene \
        backend.test_pack_catalog \
        backend.test_deploy_pack 2>&1 | tail -40
      echo "== github mirror contract (adapters/ 不在 backend discover 范围内) =="
      # 这条必须显式列出：`python -m unittest discover -s backend` 只扫 backend/，
      # 而适配器测试随适配器走（adapters/test_backend_adapter.py 同样是显式模块）。
      # 不列在这里 = 测试存在但 CI 看不见 —— 正是 B16 与前端套件清单踩过的同一个坑。
      python -m unittest adapters.github.test_github_mirror 2>&1 | tail -20
      echo "== API contract smoke (openapi must generate) =="
      # 守住"路由签名里的模型必须已导入"：ForwardRef 未解析时模块仍可 import、
      # 但 /openapi.json 500，且 /api/training/create 字段解析失败——CI 盲区。
      python -m unittest backend.test_api_complete 2>&1 | tail -20
      echo "== full backend suite (与 npm test 同口径) =="
      # B16：backend 共有 24 个 test_*.py，此前 CI 只挑 6 个显式模块跑，导致
      # backend/test_model_api.py 的两处失败（离屏渲染环境前提 + go2 契约里的
      # 陈旧 workspace 路径）长期只在本地 `npm test` 暴露。这里补一条全量
      # discover，口径与 package.json 的 `npm test` 完全一致，不再留盲区。
      # 上面保留显式模块是有意的：核心用例失败时日志更短、定位更快。
      python -m unittest discover -s backend -p "test_*.py" 2>&1 | tail -30
      echo "== B8 porting admission (rules T/S/C/X) =="
      python tools/audit_porting_admission.py
      echo "== capability packs (B1: 14 packs validate + refs sha256) =="
      python tools/validate_packs.py
      echo "== license registry (I5: 许可与出处，缺许可的内置包不得进索引) =="
      python tools/audit_licenses.py
      echo "== motion registry (M1: Motion 一等资源，注册表 vs 磁盘逐文件对账) =="
      python tools/audit_motions.py
      # A1 环境供应四段（只读启动/显式配置/镜像切换/离线 wheelhouse）—— 只做静态契约核对，
      # 不代替 Windows 实机验证（脚本自己会把这一句打出来）
      python tools/audit_provision_phases.py
      # B37 观测组名/API 残留（按机型包语义判定；静态扫描，不运行 mjlab）
      python tools/audit_obs_group_names.py
      # N5 仿真分层：data-surface 声明—消费两端（静态扫描，不渲染浏览器）
      python tools/audit_sim_surface.py
      # H23 sim2sim 执行器/滤波一致性：浏览器下发 ↔ 契约真值 ↔ 训练常量表 ↔ 电机参数卡
      # 四端同值 + B3 物理键残留复检 + 端点白名单接线钉住（rc_old 参考值只记录不判红）
      python tools/audit_sim2sim_consistency.py
      # N2 资源库许可覆盖（只看文件存在性；新缺口/名单过期判红）
      python tools/audit_resource_licenses.py
      # N6 验收判据可查性（文本级，守回归）
      python tools/audit_acceptance_verifiability.py
      # N7 tools/ 孤儿工具登记（文本级引用检测）
      python tools/audit_tools_inventory.py
      # GitHub 镜像：无密钥时打印 SKIPPED 并 exit 0（本地/CI 的常态），
      # **有密钥时才有意义** —— 真正的同步由 push / tag_push 事件的 github-mirror 做。
      # 这里跑 --check 只做一件静态可守的事：确认入口可导入、参数可解析（防止
      # "流水线里配了但脚本压根跑不起来"这种只在发布时才暴露的错）。
      python -m adapters.github.mirror --check
      # N3 插件包 CLI 可跑性冒烟（ls_plugin 此前不在任何 CI/脚本里）
      python scripts/ls_plugin.py --help > /dev/null
      echo "== doc reality check (B17: 文档数字 vs 实测) =="
      # 版本号 / 包数 / 策略数 / 资源库项目数一旦与仓库不符即红，防止再次漂移。
      python tools/doc_reality_check.py
      echo "== contracts suite (B18: 契约 / 物理绑定全量) =="
      # 2026-09-13：此前 CI 只跑 contracts.tests.test_path_bootstrap 一个模块，其余
      # 123 项（role_resolver 三级展开 / 物理载荷视图 / go2 冻结证据哈希 / 动作缩放…）
      # 长期不在门禁内 —— 结果 38 项失败（16 FAIL + 22 ERROR）无人知晓。现按
      # "迁移已完成"重写（把真值源从 simulation/config.json 换成 contract_truth，
      # 并把"缺口"正面表述为"必须覆盖每个驱动关节"）后**全量接入**。
      python -m unittest discover -s contracts/tests -p "test_*.py" 2>&1 | tail -30
      echo "== deterministic replay gate (L1/G2: judge selfcheck) =="
      # 判据实现只有一处（adapters/mjlab/replay_determinism.py）；这里跑它的自检，
      # 保证"两次逐帧一致"的判定本身不退化。真实回放比对需两份 frame log（浏览器/无头产出）。
      python tools/replay_gate.py --selftest
      echo "== control rates consistency (P2: 控制三件套口径) =="
      # v3 自洽（physics_hz == control_hz × decimation）是**硬门禁**；
      # v2 / 训练 profile 的差异是"已登记的报告项"，不判红——但必须可见。
      python tools/check_control_consistency.py
      echo "== route regression (H19: 通过率 / 最小净空 / 本体侵入) =="
      # 只守退化：与 tools/baselines/route_regression_baseline.json 对比，通过率下降 /
      # 最小净空下降 / 新增超时或碰撞 / 本体侵入路线增加 / H13 后处理不再消掉 VIOLATION
      # ——任一发生即 exit 2。基线刷新是**显式动作**（--write-baseline），避免顺手改绿。
      # 含 dwa（采样式规划器约 9 s/条）：这是 H11「DWA 未到达」结论的唯一自动守卫点，
      # 慢值得。CI 用 --routes 1 控制规模，本地可用 --routes 6 做更重的回归。
      python tools/route_regression.py --with-dwa --routes 1
      echo "== map visuals consistency (地图视觉基调：skybox / groundplane / light) =="
      # 10 张图的视觉基调原本各写各的：apartment 连 <visual>/<light> 都没有，flat 用纯黑
      # skybox、stairs 用 gradient，groundplane 的 reflectance 在 0.0/0.2 之间来回。
      # 这里只**检查**是否仍与 mjlab 官方口径一致（exit 2 = 有漂移）；
      # 刷新用 `python tools/unify_map_visuals.py --apply`。
      # 同时守住「外部贴图必须存在」——cross_slope / cross_stairs 曾因 `imgs/` 没跟着 xml
      # 一起拷过来而**长期编译不过**（引用了不存在的 label_*.png）。
      python tools/unify_map_visuals.py
      echo "== map dual-link audit (assets/maps vs web/sim2sim/assets/go2) =="
      # 两套地图是**设计上并存**的：新链路=公共地图库（纯环境，服务端按机型注入机器人），
      # 旧链路=内置 bundled flow（自带 go2 include，且与 Go2 策略的 reference MJCF 耦合）。
      # 但地形几何同源、靠手工同步，已经出过「贴图没跟着拷 ⇒ cross_slope/cross_stairs
      # 长期编译不过」的事故。这步守**资源完整性**（硬门禁）；地形几何差异只报告不判红
      # ——差异可能是有意的（如 slope 的 friction）。
      python tools/audit_map_duplication.py
  - name: browser-e2e-gate
    script: |
      set -eo pipefail
      echo "== 浏览器 e2e（整目录：页面健康 / 任务插件 / 深度相机 / UI 指标 / 高级仿真布局） =="
      # **为什么必须有这一段（2026-09-23 实测踩到）**：`web/sim2sim/app.js` 里一个
      # `ReferenceError: normalizedNameMap is not defined`（把该函数抽进
      # `obs/actuator_modes.js` 后，app.js 里 5 处调用点没跟着改名）**打断了基础仿真页的
      # 整个初始化**（applyRuntimeConfig → applyActuatorContract），而那一轮所有门禁全绿：
      #   · 前端单测**不加载 app.js**（只测纯逻辑模块）；
      #   · `node --check` 只查语法，查不出"名字不存在"；
      #   · `tests/e2e/` **不在流水线里** ⇒ 页面级错误没人看。
      # 于是"页面坏了"与"门禁全绿"同时成立 —— 与 B16 那条同一个形态：**有测试 ≠ 门禁在守**。
      # 这一段把「至少一条真开页面的用例」钉进 main 门禁；用例本身在
      # `tests/e2e/test_task_plugin_fill.py`（约 3 s，装浏览器才是长板）。
      #
      # **为什么现在是整目录跑**（2026-09-23 收编，替换掉原先"只跑四个文件"的写法）：
      #   · 原先 `pytest tests/e2e/` **收集阶段就炸**（`test_all_models.py` 用
      #     `read_text(encoding="utf-8")` 读带 BOM 的包配置 ⇒ `JSONDecodeError`）——
      #     e2e 一直不在 CI 里，所以没人发现。改 `utf-8-sig` 后 **83 条可收集**。
      #   · 收集能过之后暴露出**三类长期红**（都不是产品缺陷，而是"测试停在旧世界"）：
      #     ① 期望陈旧：`test_ui_audit_3` 的地形组名漏了后来新增的 `比赛地图`；坞来源期望
      #        写死九个（漏 `contact` / `lidar_height_scan`）且假定默认就有 `odom`
      #        （而设计口径是"odom 属外挂、默认关"）⇒ 现改为**从 `DOCK_SOURCES` 现取**真值
      #        并把 `odom` 断言改成"勾上插件后立即可选"（顺带钉住"插件→来源"这条链）。
      #     ② 证据反过来咬判据：`page.screenshot` 在整目录连跑时抛 `Unable to capture
      #        screenshot`（页面还在跑 WASM/WebGL 仿真、机器吃紧）⇒ **断言全过的用例因为一张
      #        截图被判红**。两个 e2e 文件的截图一律改成**尽力而为**（截不到只打印一句）。
      #     ③ 把负载当缺陷：页面健康用例等"骨架态消失"的窗口从 20s 提到 45s（连跑时首屏
      #        取数变慢，是环境节奏不是产品属性；真卡住仍会红）。
      #   · 修完实测 **整目录 68 passed / 15 skipped / 0 failed，约 5.3 min**（含四个新文件：
      #     任务插件消费 / 深度相机预览 / UI 指标 13 态 / 高级仿真布局）。
      #   · 因此本阶段**整目录跑**：与其在 CI 里维护一份"挑着跑"的清单（清单本身会过期，
      #     上面三类红就是这么攒出来的），不如让整目录必须绿。墙钟是长板，但这是唯一能挡住
      #     "页面坏了而门禁全绿"的闸（2026-09-23 那个 `normalizedNameMap` ReferenceError
      #     就是在所有单测/语法门禁全绿的情况下打断了整个基础仿真页的初始化）。
      python -m pip install --quiet --break-system-packages playwright pytest pytest-playwright
      # 与 .dev-env-bootstrap 同口径：**装不上如实报，不把环境问题判成红**
      # （但一定要可见——静默 skip 正是本条要消灭的东西）。
      if python -m playwright install --with-deps chromium >/dev/null 2>&1; then
        python -m pytest tests/e2e/ -q 2>&1 | tail -25
      else
        echo "[WARN] Chromium 装不上：本轮 browser-e2e-gate 未跑（环境问题，不判红；但请留意）"
      fi

# CPU 训练冒烟门禁的环境：默认镜像 + 启动时供应训练 venv。
# 依赖不固化在镜像层，因此不会再把「镜像重建」与「训练链路」耦在一起。

.cpu-training-env: &cpu-training-env
  # 与 .main-env 同理：这条 pipeline 的第一步是 .dev-env-bootstrap（要 python3/pip），
  # 而 **CI runner 的默认镜像没有 python**（实测 `python`/`python3` 均 127），
  # 所以必须显式给一个带解释器的**运行底座**：镜像只是底座，依赖仍由
  # .dev-env-bootstrap 现装（训练 venv 由 uv 自供），不把依赖固化进镜像层。
  # 注：bootstrap 内部**同样自带**自举段（无 python3 时按发行版安装）——双保险，
  # 保证即使将来这个 image 被移除 / 换成无 python 的底座，门禁也不会在开局 127。
  docker:
    image: python:3.12
  env:
    # 训练 venv 落点：仓库外，不被 bind mount 覆盖（由 dev-env-bootstrap 供应）。
    LEGGED_STUDIO_MJLAB_VENV: /opt/legged-studio/mjlab-cpu/.venv
    # 冒烟档固定 CPU：显式而非依赖"碰巧没 GPU"，避免门禁语义随 runner 漂移。
    LEGGED_STUDIO_TRAIN_DEVICE: cpu
    # 限制线程数，避免核数上调后 torch/warp 线程超订导致抖动。
    OMP_NUM_THREADS: "4"
    # 冒烟规模：门禁守的是"回路通不通"（栈可导入 / reward 有限 / 权重在动 /
    # time_outs 已接线），不是"训得好不好"——判据强度不随规模线性增长，
    # 而墙钟时间近似线性。64x20 折半再折半到 16x5，判据强度不变、时间砍掉大半。
    # 需要更长冒烟时本地显式覆盖即可（脚本默认值与这里保持一致）。
    SMOKE_NUM_ENVS: "16"
    SMOKE_ITERS: "5"

# CPU 训练冒烟门禁的"相关变更面"。
#
# 为什么要有它：这条门禁要现装整份 CPU 训练栈（torch/warp/mujoco_warp，实测
# 数分钟量级），而它本身只跑分钟级冒烟；镜像时代这里曾对齐"重建镜像"的代价
# （见 issue #31），现在对齐的是"现装训练栈"的代价。非训练改动不再付这笔钱。
#
# 清单口径 = 能改变"训练链路结论"的最小路径集：
#   - 训练栈本体（adapters/mjlab、venv 供应脚本）
#   - 门禁自身与其消费的启动路径（scripts / tools 的冒烟工具）
#   - 训练控制面（backend 的 training* 与 health 深度体检）
#   - 契约与资产（contracts 校验/训练不变量；assets 里被训练消费的机器人契约）
#   - 供应与流水线定义（provision 脚本、本文件）

.cpu-training-paths: &cpu-training-paths
  - .cnb.yml
  - adapters/mjlab/**
  - backend/training/**
  - backend/training_api.py
  - backend/training_manager.py
  - backend/training_config_helpers.py
  - backend/health_api.py
  - backend/health_layers.py
  - backend/health_cards.py
  - contracts/**
  - assets/robots/**
  - scripts/provision_cpu_training.sh
  - scripts/cpu_training_smoke_gate.sh
  - tools/validate_training_smoke.py
  - tools/_smoke_one.py


.sim2sim-env: &sim2sim-env
  # 同 .cpu-training-env：首段 .dev-env-bootstrap 要 python3/pip，默认 runner 镜像没有 python。
  docker:
    image: python:3.12
  # 无头 CPU sim2sim 验收器需要 mujoco（纯 CPU wheel）+ onnxruntime，
  # 由 .dev-env-bootstrap 在启动时按需安装（与开发环境同一份 requirements）。
  stages:
    - <<: *dev-env-bootstrap
    - name: headless-sim2sim-gate
      # 与 cpu-training-gate 同理：stage.script 由 sh（dash）解释，
      # `set -o pipefail` 直接报 Illegal option，门禁会在开局就退出（判据压根没跑）。
      # 用 bash 显式执行规避。
      script: |
        echo "== CPU headless sim2sim acceptance (all declared policies) =="
        # 口径按「包内声明的全部策略」扫描（不写死条数：曾在注释里写 47，而声明
        # 已增至 48，注释与实测漂移——B16 一并纠正）。基线在
        # tools/baselines/sim2sim_headless_baseline.json，门禁只守"不许新增失败/
        # 退化"，全量基线刷新用 --write-baseline。
        exec bash -o pipefail -c '
        set -e
        python tools/sim2sim_headless.py --seconds 3 --baseline tools/baselines/sim2sim_headless_baseline.json --output-dir workspace/validation
        echo "== determinism: 同一策略两个独立无头进程逐帧一致（L1/G2 + B12-R2 的判据） =="
        # 判据实现：adapters/mjlab/frame_log.py（产出端）+ tools/replay_gate.py（比对）。
        # 两个独立进程各跑一遍，抓的是**跨进程**的非确定性（同进程内跑两次测不出来）。
        # 选 zex-w 的声明的策略之一（id 走后端统一解析器，与页面/验收同一真值源）。
        python tools/replay_gate.py --produce --package assets/robots/zex-w --policy-id zex-w-rough-9600 --steps 40 --min-frames 30
        echo "== determinism collector: --auto 单参数采集器（S4：给定目标 → 自动两进程采集 + 比对） =="
        # 同一产出端/判据（零重写）；这里守的是**编排入口**：一个目录目标自己解析出（包，策略），
        # 自动起两个独立子进程各跑一遍再比对（40 步实测数秒级，与上行同量级，不超预算）。
        python tools/replay_gate.py --auto assets/robots/zex-w --policy-id zex-w-rough-9600 --steps 40 --min-frames 30
        '


# ───────────────────────────────────────────────────────────────────────────
# GitHub 自动上传（镜像）
#
# 本仓（CNB）是开发主仓，GitHub 侧保留一份**可直接克隆**的公开副本。
# 手工同步的问题不是"麻烦"，是**没人知道上一次同步到哪个提交**：漏同步、同步一半、
# 把未发布的分支推上去，都只能靠人记。所以这里把它做成一条可复跑的流水线步骤。
#
# 三件事写在这里，是因为它们都是"看起来能省、省了必出事"的：
#
# 1. `imports` 引**密钥仓库** `zeitvex/github-secrets` —— 密钥只进环境变量，
#    不落在工作区文件里。$GITHUB_TOKEN 仅由 `adapters/github/mirror.py` 经
#    `http.extraheader` 传给 git（不进 `.git/config`、不进 argv），输出侧一律脱敏。
# 2. **只在 push / tag_push 触发**：密钥仓库 owner 触发的 pipeline 默认就有权引用；
#    但这里显式挂在发布事件上，PR 侧的贡献者代码拿不到密钥（最小授权）。
# 3. **判据是 sha 相等，不是"名字在不在"**：每次运行先查 GitHub 侧 ref 的实际 sha，
#    与本地一致即跳过 —— 于是这条步骤**幂等**，重跑不会重复推、也不会推错。
#
# 触发面：`main` 分支的 push（同步主分支）+ 任意 `v*` tag（同步版本与 Release）。
# 本地/PR 上拿不到密钥时，脚本打印 `SKIPPED` 并 exit 0 —— **没配密钥不是失败**，
# 判据是"配了就同步"。手动演练：`python -m adapters.github.mirror --check`。
.github-mirror: &github-mirror
  name: github-mirror
  docker:
    # 与其余门禁同底座：CI runner 默认**没有 python**（见上方注释），必须显式声明。
    image: python:3.12
  imports:
    # 密钥文件（格式见 https://cnb.cool/zeitvex/github-secrets/-/blob/main/github-secrets.yaml）：
    #   GITHUB_USER:  "your-github-username"
    #   GITHUB_TOKEN: "ghp_xxxxxxxxxxxxxxxxxxxx"
    # 需要 push 到别的仓库时再加一行 `GITHUB_REPO: "owner/repo"`（缺省 = $GITHUB_USER/LeggedStudio）。
    - https://cnb.cool/zeitvex/github-secrets/-/blob/main/github-secrets.yaml
  stages:
    - name: mirror
      script: |
        set -eo pipefail
        # 本脚本**只用标准库**（urllib + git CLI）——镜像动作不该依赖控制面那套 pip 包，
        # 否则"上传失败"里会混进"依赖装不上"两种原因。
        python -m adapters.github.mirror

frontend:
  push:
    - name: frontend-check
      docker:
        image: node:20
      stages:
        - name: syntax
          script: |
            set -e
            echo "== node version =="
            node --version
            echo "== syntax check web js =="
            find web -name '*.js' -not -path '*/vendor/*' | while read f; do node --check "$f"; done
            echo "frontend syntax OK"
        - name: static-smoke
          script: |
            set -e
            echo "== vendor assets present =="
            test -f web/sim2sim/vendor/three/build/three.module.js
            test -f web/sim2sim/vendor/mujoco/mujoco.js
            test -f web/sim2sim/vendor/onnxruntime-web/dist/ort.wasm.min.mjs
            echo "vendor assets OK"
            echo "== index references app.js =="
            node -e "const h=require('fs').readFileSync('web/sim2sim/index.html','utf8');if(!h.includes('./app.js'))throw new Error('app.js missing');console.log('index OK')"
            echo "== 前端单元套件（**自动枚举**：新增 *.test.mjs 即纳入，不再维护手写清单）=="
            # 这里原先是一份**手写清单**，于是 navigation / onnx_contract_check / terrain_groups
            # 三套测试**存在却没进 CI** —— 与下面第一条注释要解决的是同一个问题
            # （"本地能跑、CI 看不见等于没有"）。清单改为从文件系统派生：新增套件不会漏。
            # 每套件守什么写在各自文件头部（`node <套件>` 直接跑，零依赖）。
            # 注意用 for（不是 while 子shell）：`set -e` 才能让首个失败立即中止。
            suites=$(find web -name '*.test.mjs' -not -path '*/vendor/*' | sort)
            echo "$suites"
            for suite in $suites; do echo "== $suite"; node "$suite"; done
main:
  push:
    # **这里是现在的默认门禁路径**（PR 事件侧已整段移除，理由见下方 main 段落说明）。
    # 合并进 main 的代码必然经过这一整套判据，因此"没跑过门禁的代码进主干"不成立；
    # 合并前的主动验证走 web_trigger_pr_gate / web_trigger_training_gate 手动门禁。
    #
    # 语法门禁独立成 pipeline（零依赖，`syntax-check` 锚点直挂）。
    # 与 `backend-test` 单测**并发**：整个 push 的墙钟 ≈ max(两者)，
    # 而不是此前 syntax-check → unit-tests 串行相加。两段共用同一份依赖/
    # 语法事实源，拆开只是让「短门禁早出结论、长门禁不等待短门禁」。
    # 多一个 pipeline 不增加并发容器数（仍是 2 个），只把 max 从 unit-tests
    # 换成 max(syntax, unit-tests) —— 单测仍是长板。
    - <<: *syntax-check
    - name: backend-test
      <<: *main-env
    # GitHub 镜像：main 的每次 push 同步一次（幂等，无变更即跳过）。
    # 加锁的理由见文件头「并发即配额」注：push 侧多条并发 = 多份同时预冻结，
    # 现在统一纳入一把锁 `ci-gate`，任一时刻只有 1 份在生效。
    # 对镜像本身的代价极小——它是纯 I/O，排队多等的是前序门禁的时间。
    #
    # 锁 key 由 `ci-pr` 改名为 `ci-gate`：PR 事件侧已整段移除（见下方 main 段落说明），
    # 现在这把锁保护的是「main.push 全量门禁 + web_trigger 手动门禁」这组共用同一份
    # 根组织额度的 pipeline，名字再叫 ci-pr 只会误导（额度是按根组织算的，锁也按组织粒度）。
    - <<: *github-mirror
      lock:
        key: ci-gate
        wait: true
    - name: cpu-training-smoke
      <<: *cpu-training-env
      # 仅训练相关路径变更才触发（见 .cpu-training-paths 注释）：
      # 无关改动（docs/web 等）不再触发 torch 镜像重建。
      ifModify: *cpu-training-paths
      stages:
        - <<: *dev-env-bootstrap
        - name: cpu-training-gate
          # 用 bash 执行：CNB 的 stage.script 默认由 sh 解释，Debian/dash 下
          # `set -o pipefail` 会直接报 "Illegal option"（本门禁曾因此在 167ms 内失败，
          # 判据压根没跑）。这里显式交给 bash，门禁脚本自带 set -euo pipefail。
          script: |
            echo "== CPU 训练冒烟门禁 =="
            # 逻辑集中在 scripts/cpu_training_smoke_gate.sh：CI 与本地同一条命令，
            # 避免"CI 里跑的口径"和"人本地复现的口径"漂移。
            exec bash scripts/cpu_training_smoke_gate.sh

  # ─────────────────────────────────────────────────────────────────────────
  # 这里原先是 `pull_request:` 三条完整门禁。**已整段移除**，原因如下——
  #
  # 移除原因（2026-09-22，构建 cnb-bg8-1k33dbdn8 实测）：
  #   报错仍是 `CPU core-hours are insufficient for pre-freezing
  #   (equivalent to 0.08 core-hours)`——**1 核**是平台允许的最小值，
  #   即"单价"已经降到地板，仍然冻结不到。这说明根组织当月 160 核时的构建额度
  #   已实际见底：此时**任何** `cpus × 5min > 剩余额度` 的 pipeline 都进不了 Prepare，
  #   与跑什么判据、装什么依赖无关。配置侧已**无额度可降**。
  #
  #   （"降核 + 串行都治不了根"的机理见文件头同段注；这两条本段都试过，均被驳回。）
  #
  #   验证过并放弃的替代方案：
  #     - 继续降核：1 核已是 `cnb:arch:amd64` 的下限（范围 1~64），无路可走；
  #       （注：这里的 1 核是**当时**为躲额度临时设的下限，现已随「CI 资源规模」
  #       一节整段回退——`runner.cpus` 全部删除，回归平台默认 8 核。）
  #     - 加 `lock` 串行：只把"并发份数"从 3 降到 1，降不了那 1 份的**单价**，
  #       且排队重试自身也要重新 Prepare，0.08 核时同样冻不到
  #       （本 PR 上一版 `a685ca93` 正是这么写的，仍被驳回）；
  #     - **自托管构建机**（`runner.namespace: group` + `tags`）：**不消耗平台核时**，
  #       是绕开额度的正解，但需要根组织管理员先接入节点，非仓库侧配置可解。
  #       接入后可按需把本段恢复，并直接把 runner 指向自托管节点。
  #
  # 现在的门禁路径（判据强度不变，只是换承载事件）：
  #   1. **main.push = 全量门禁（默认路径）**。syntax-check / backend-test /
  #      cpu-training-smoke(-pr 的同一份判据) / frontend / github-mirror 都在 push 上；
  #      PR 合并进 main 后即受同一套判据约束，不存在"没跑过的代码进主干"。
  #   2. **web_trigger_pr_gate / web_trigger_training_gate = 手动门禁（补充路径）**。
  #      在**分支详情页**点按钮即可对任意分支（含 PR 源分支）跑完全一致的判据，
  #      用于合并前主动验证；只在额度充足时按需触发，不再让每次 PR 事件无条件扣额度。
  #
  # 注意：平台**没有"额度不足时自动跳过"的配置**——预冻结失败就是 error，
  # 挂 `ifModify` 也挡不住（条件在 Prepare 之后才判）。所以只能从"触发面"上摘，
  # 不能指望平台侧降级。额度恢复（或接入自托管构建机）后可原样恢复本段。
  # ─────────────────────────────────────────────────────────────────────────

# ── 手动门禁（web_trigger）：额度充足时的 PR 等价路径 ──────────────────────
#
# 事件名对应 `.cnb/web_trigger.yml` 里的两个按钮（分支详情页可见）。
# 判据与 push 侧**逐字同源**：直接复用 *syntax-check / *main-env / *cpu-training-env
# 三个锚点，不复制脚本——「手动跑的」和「合并后跑的」必须是同一份判据。
#
# 为什么是 web_trigger 而不是 api_trigger：web_trigger 从**对应分支**读配置，
# 于是能在 PR 源分支上跑；且按钮天然带"人主动确认"的语义，扣额度是显式动作。
#
# 同样共用一把锁（key: ci-gate）：手动触发与 main.push 全量门禁串行，
# 避免同一份根组织额度被同时冻结多份（额度按根组织算，锁也按组织粒度）。
# 这把锁买的是"不额外多冻"，买不到额度本身——额度见底时手动点它一样会被驳。
web_trigger_pr_gate:
  web_trigger:
    - <<: *syntax-check
      lock:
        key: ci-gate
        wait: true
    - name: backend-test-pr
      <<: *main-env
      lock:
        key: ci-gate
        wait: true

web_trigger_training_gate:
  web_trigger:
    - name: cpu-training-smoke-pr
      <<: *cpu-training-env
      lock:
        key: ci-gate
        wait: true
      # 手动门禁不挂 ifModify：既然是"人主动确认要跑"，就不该再被路径条件静静吞掉
      # （这正是本仓反复踩过的"配了却没跑"）。要省额度就别点这个按钮。
      stages:
        - <<: *dev-env-bootstrap
        - name: cpu-training-gate
          # 同 push 侧：stage.script 由 sh 解释，不能用 `set -o pipefail`。
          # 显式 exec bash 让门禁脚本自己的 set -euo pipefail 生效。
          script: |
            exec bash scripts/cpu_training_smoke_gate.sh

# 云原生开发：点「云原生开发」按钮即建环境。
#
# 镜像 = **CNB 默认镜像**（这里刻意不写 docker.image / docker.build）。
# 默认镜像自带 code-server + ssh（单容器模式）、CodeBuddy Web 与 WebIDE 插件、
# Python 3.12 / Node 22 / uv / git-lfs / zsh，以及 cnb-cli + skills —— 这些
# 正是自建镜像时代要一项项手工补回的东西。
#
# 依赖（控制面 pip 包 / CPUs 训练 venv / 无头浏览器依赖）由 stages 在启动时
# **按需供应**：dev-env-bootstrap 的 import 探测让重复进环境短路为秒级校验。
#
# 这里刻意**不用 `docker.volumes` 声明缓存卷**：该字段在流水线里合法（Schema 列
# docker.image/build/volumes/devcontainer），但 **vscode 事件下会被平台拒绝**——
# 报 `不允许的字段 "docker.volumes"`（本仓 v0.56.2 前踩过）。云开发用的是平台
# 托管的开发环境，缓存复用由平台的节点卷/幂等供应共同保证，不按流水线那套配。
$:
  # Tag 事件：`v*` 的 push 就是"发布"这个动作本身。
  #
  # **必须挂在 "$" 兜底分支下**：tag_push 是**仓库级**事件（不属于任何分支），
  # 挂在 `main:` 下会被平台判为非法配置（本仓第一版正是这么写的，schema 校验直接报
  # 「分支 "main" 下不允许使用仓库级事件 "tag_push"」）。这类错在页面上表现为
  # "打了 tag 但什么都没发生"，很难从现象倒推回来。
  #
  # 与 push 侧共用同一个 *github-mirror 锚点（同一份判据/同一套日志），另加两件发布专属的事：
  #   1. **本仓（CNB）建 Release** —— 平台内置任务 `git:release`（tag_push 免传 tag）；
  #   2. **GitHub 侧建 Release** —— `adapters/github/mirror.py` 推完 tag 后建同名 Release。
  #      两边都建，是因为两边都有人直接下载：只有本仓有 Release 时，GitHub 访客看不到版本——
  #      而镜像的意义正是"GitHub 侧可直接用"。
  #
  # 为什么不做"只同步正式 tag"的分支白名单：tag 的语义由打 tag 的人负责，
  # 流水线再猜"这个 tag 算不算正式"只会制造第二套真相。`v*` 是唯一门槛。
  tag_push:
    - <<: *github-mirror
      stages:
        - name: release
          type: git:release
          options:
            overlying: true
            title: "$CNB_BRANCH"
        - name: mirror
          script: |
            set -eo pipefail
            echo "== 发布 $CNB_BRANCH：同步 tag 到 GitHub 并建 Release =="
            python -m adapters.github.mirror
  vscode:
    - name: legged-studio-dev
      services:
        - vscode
        - docker
      env:
        # 训练 venv 落点：仓库外，不被 bind mount 覆盖（由 dev-env-bootstrap 供应）。
        LEGGED_STUDIO_MJLAB_VENV: /opt/legged-studio/mjlab-cpu/.venv
        MUJOCO_GL: disabled
      # 缓存复用靠平台节点卷 + dev-env-bootstrap 的幂等短路，不声明 docker.volumes
      # （vscode 事件下该字段不被平台接受，见上方注释）。
      stages:
        - name: dev-env-bootstrap
          script: |
            set -e
            echo "== 解释器与包管理器（与 .dev-env-bootstrap 同一口径） =="
            # 云开发用平台默认 dev 环境，理论上自带 python3；这里仍是**自举**而非假设
            # ——同一条锚点在 CI（.cpu-training-env，默认 runner 无 python3）上必须自举才跑得起来，
            # 两处口径保持一致，避免"开发环境能起、CI 起不来"再次分叉。
            if ! command -v python3 >/dev/null 2>&1; then
              echo "无 python3：按发行版安装"
              if command -v apt-get >/dev/null 2>&1; then
                export DEBIAN_FRONTEND=noninteractive
                apt-get update -qq
                apt-get install -y -qq python3 python3-pip python3-venv
              elif command -v apk >/dev/null 2>&1; then
                apk add --no-cache python3 py3-pip python3-dev
              elif command -v dnf >/dev/null 2>&1; then
                dnf install -y -q python3 python3-pip
              elif command -v yum >/dev/null 2>&1; then
                yum install -y -q python3 python3-pip
              fi
            else
              command -v pip >/dev/null 2>&1 \
                || python3 -m ensurepip --upgrade >/dev/null 2>&1 \
                || true
            fi
            command -v python3 >/dev/null 2>&1 \
              || { echo "[FAIL] 无法获得 python3"; exit 1; }
            python3 --version
            echo "== 控制面依赖（幂等） =="
            # 默认镜像不预装本项目依赖：已装好就跳过，否则按 requirements 装。
            # 用 python3：默认镜像里 python 也是 3.12，两者等价。
            python3 -c "import fastapi, uvicorn, pydantic, numpy, mujoco" 2>/dev/null \
              || python3 -m pip install --quiet --break-system-packages \
                   -r backend/requirements.txt httpx onnx onnxruntime 2>&1 | tail -5
            python3 -c "import fastapi, uvicorn, pydantic, numpy, mujoco" \
              || { echo "[FAIL] 控制面依赖供应失败"; exit 1; }
            echo "== 无头浏览器（Playwright Chromium，版本标记对齐） =="
            # 浏览器是本仓的刚需（sim2sim 结论全是浏览器实测得出的）。
            python3 -m pip install --quiet --break-system-packages playwright pytest pytest-playwright 2>&1 | tail -3
            PLAYWRIGHT_VERSION="$(python3 -c 'import playwright,sys;print(playwright.__version__)')"
            # Chromium 是"上一次的版本"：版本不合就重装（否则 E2E 会静默用旧浏览器跑，
            # 正是"本地能跑、CI 看不见"的同类坑）。
            MARKER="/root/.cache/ms-playwright/.legged-studio-playwright-version"
            if [ "$(cat "$MARKER" 2>/dev/null || true)" != "$PLAYWRIGHT_VERSION" ]; then
              python3 -m playwright install --with-deps chromium 2>&1 | tail -5
              printf '%s' "$PLAYWRIGHT_VERSION" > "$MARKER"
            else
              echo "chromium 已是 playwright $PLAYWRIGHT_VERSION，跳过"
            fi
            echo "== CPU 训练 venv（幂等） =="
            # 默认镜像自带 uv，但这里同样不写死路径：脚本会 PATH 探测、缺失则自动安装，
            # 与 CI 侧同一口径（默认镜像里 uv 就在 PATH 上）。
            bash scripts/provision_cpu_training.sh
        - name: assert-default-env
          # 回归哨兵：默认镜像本该提供 WebIDE 服务端与 CodeBuddy 入口。
          # 缺失说明镜像被换回去了 / 平台默认环境变了，在环境启动时就显式报出来，
          # 而不是让人对着卡住的终端或消失的右键菜单猜。
          script: |
            set -e
            echo "== 默认环境自检 =="
            if ! command -v code-server >/dev/null 2>&1; then
              echo "[FAIL] 无 code-server -> 会退回双容器模式（终端停在「连接到 CNB 容器中...」）"
              echo "       修复：确认 .cnb.yml 的 vscode 段未指定无法提供 WebIDE 的镜像"
              exit 1
            fi
            code-server --version
            for cmd in python3 node uv git-lfs; do
              command -v "$cmd" >/dev/null 2>&1 \
                && echo "  $cmd: $(command -v "$cmd")" \
                || echo "  [WARN] 缺 $cmd（默认镜像应自带；缺失可能影响对应链路）"
            done
            if command -v codebuddy >/dev/null 2>&1; then
              echo "CodeBuddy Web: 入口可用"
            else
              echo "CodeBuddy Web: 未安装（不影响 WebIDE）"
            fi
            echo "== WebIDE AI 助手插件自检（CodeBuddy IDE 插件） =="
            # 默认镜像预装了 CodeBuddy 插件；不预装就表现为「插件没了、右键没有
            # AI 助手」。只告警不失败：插件缺失不影响控制面与训练链路。
            if code-server --list-extensions 2>/dev/null | grep -qi 'coding-copilot'; then
              echo "CodeBuddy 插件: 已装（WebIDE 右键可见 AI 助手）"
            else
              echo "[WARN] 未预装 CodeBuddy 插件 -> WebIDE 无 AI 助手入口"
              echo "       临时可用: code-server --install-extension Tencent-Cloud.coding-copilot"
            fi
        - name: start-control-plane
          script: |
            set -e
            echo "== Legged Studio 控制面启动 =="
            # 必须监听 0.0.0.0，否则 WebIDE 端口预览打不开
            python -m uvicorn backend.api_complete:app --host 0.0.0.0 --port 8765 --log-level warning &
            echo "backend pid=$!"
            for i in $(seq 1 30); do
              if curl -sf http://127.0.0.1:8765/health >/dev/null; then
                echo "backend ready"
                break
              fi
              sleep 1
            done
            # 端口预览地址：CNB_VSCODE_PROXY_URI 形如 https://xxx-{{port}}.cnb.run
            # 用 sed 做替换（不依赖 bash 的 ${var/pat/rep}，兼容 sh）。
            PREVIEW=$(printf '%s' "$CNB_VSCODE_PROXY_URI" | sed 's/{{port}}/8765/g')
            echo ""
            if [ -x "$LEGGED_STUDIO_MJLAB_VENV/bin/python" ]; then
              echo "CPU 训练: 就绪（$LEGGED_STUDIO_MJLAB_VENV）"
              echo "           冒烟: bash scripts/cpu_training_smoke_gate.sh"
            else
              echo "CPU 训练: 未供应（跑 scripts/provision_cpu_training.sh）"
            fi
            # MCP 工具链（开发期，不预装 server 本体）：打印配置路径 + 自检自研 server。
            if [ -f .cnb/mcp/servers.json ]; then
              echo "MCP:      $(pwd)/.cnb/mcp/servers.json （$(python -c 'import json;print(len(json.load(open(".cnb/mcp/servers.json"))["mcpServers"]))') 条 server，见 .cnb/mcp/README.md）"
              python -m unittest backend.test_mcp_servers >/dev/null 2>&1 \
                && echo "         自研 server 自检: OK" \
                || echo "         自研 server 自检: 失败（python -m unittest backend.test_mcp_servers -v）"
            fi
            echo "工作台:   $PREVIEW/web/workbench.html"
            echo "sim2sim:  $PREVIEW/web/sim2sim/index.html"
            echo "API 文档: $PREVIEW/docs"
            echo "（也可在 WebIDE 的 PORTS 面板手动映射 8765）"
