.main-env: &main-env
  runner:
    cpus: 8
  # 后端任务必须显式声明带解释器的镜像；默认 runner 环境没有 python/pip，
  # 否则命令直接 127（command not found）。与 frontend 的 node:20 同理。
  docker:
    image: python:3.12
  stages:
    - name: syntax-check
      script: |
        set -eo pipefail
        echo "== py_compile changed python =="
        # 排除 .venv / node_modules：训练 venv 里是第三方轮子（可能是 3.12+ 语法），
        # 不该由本仓库的语法检查负责。
        find backend contracts adapters/mjlab tools scripts -name '*.py' \
          -not -path '*/.venv/*' -not -path '*/node_modules/*' -print0 \
          | xargs -0 -n1 python -m py_compile 2>&1 | tail -20
        echo "python syntax check done"
        echo "== contract artifact drift check =="
        python tools/generate_contract_models.py 2>&1 | tail -20
    - name: unit-tests
      script: |
        set -eo pipefail
        echo "== install control-plane deps =="
        pip install --quiet --upgrade pip || true
        # 与 backend/requirements.txt 保持一致；httpx 是 starlette TestClient 依赖。
        pip install --quiet -r backend/requirements.txt httpx
        echo "== path_bootstrap tests =="
        python -m unittest contracts.tests.test_path_bootstrap 2>&1 | tail -20
        echo "== pure-logic backend tests =="
        python -m unittest \
          backend.test_nav_avoidance \
          backend.test_map_editor_api \
          backend.test_perception_observations \
          backend.test_hygiene \
          backend.test_pack_catalog \
          backend.test_deploy_pack 2>&1 | tail -40
        echo "== API contract smoke (openapi must generate) =="
        # 守住"路由签名里的模型必须已导入"：ForwardRef 未解析时模块仍可 import、
        # 但 /openapi.json 500，且 /api/training/create 字段解析失败——CI 盲区。
        python -m unittest backend.test_api_complete 2>&1 | tail -20
        echo "== B8 porting admission (rules T/S/C/X) =="
        python tools/audit_porting_admission.py
        echo "== capability packs (B1: 14 packs validate + refs sha256) =="
        python tools/validate_packs.py

# CPU 训练冒烟门禁的环境：与云原生开发共用 .ide/Dockerfile，镜像里已固化
# mjlab 的 cpu extra（LEGGED_STUDIO_MJLAB_VENV 指向镜像内 venv），因此门禁
# 不需要每次重装 torch——进容器即可跑真训练。
.cpu-training-env: &cpu-training-env
  runner:
    cpus: 8
  docker:
    build: .ide/Dockerfile
  env:
    # 镜像层的 CPU venv 落点（仓库外，不被 bind mount 覆盖）。
    LEGGED_STUDIO_MJLAB_VENV: /opt/legged-studio/mjlab-cpu/.venv
    # 冒烟档固定 CPU：显式而非依赖"碰巧没 GPU"，避免门禁语义随 runner 漂移。
    LEGGED_STUDIO_TRAIN_DEVICE: cpu
    # 限制线程数，避免 8 核 runner 上 torch/warp 线程超订导致抖动。
    OMP_NUM_THREADS: "4"

.sim2sim-env: &sim2sim-env
  runner:
    cpus: 8
  # 无头 CPU sim2sim 验收器需要 mujoco（纯 CPU wheel）+ onnxruntime。
  # 与云原生开发环境共用 .ide/Dockerfile，保证 CI 与开发环境同一套依赖。
  docker:
    build: .ide/Dockerfile
  stages:
    - name: headless-sim2sim-gate
      script: |
        set -eo pipefail
        echo "== CPU headless sim2sim acceptance (47 policies) =="
        # 既有 3 条特技/跑酷判据未过（go2 backflip/jump/pie-parkour）已记录在基线里；
        # 门禁只守"不许新增失败/退化"，全量基线刷新用 --write-baseline。
        python tools/sim2sim_headless.py --seconds 3 \
          --baseline tools/baselines/sim2sim_headless_baseline.json \
          --output-dir workspace/validation

frontend:
  push:
    - name: frontend-check
      runner:
        cpus: 4
      docker:
        image: node:20
      stages:
        - name: syntax
          script: |
            set -e
            echo "== node version =="
            node --version
            echo "== syntax check web js =="
            find web -name '*.js' -not -path '*/vendor/*' | while read f; do node --check "$f"; done
            echo "frontend syntax OK"
        - name: static-smoke
          script: |
            set -e
            echo "== vendor assets present =="
            test -f web/sim2sim/vendor/three/build/three.module.js
            test -f web/sim2sim/vendor/mujoco/mujoco.js
            test -f web/sim2sim/vendor/onnxruntime-web/dist/ort.wasm.min.mjs
            echo "vendor assets OK"
            echo "== index references app.js =="
            node -e "const h=require('fs').readFileSync('web/sim2sim/index.html','utf8');if(!h.includes('./app.js'))throw new Error('app.js missing');console.log('index OK')"

main:
  push:
    - name: backend-test
      <<: *main-env
    - name: cpu-training-smoke
      <<: *cpu-training-env
      stages:
        - name: cpu-training-gate
          script: |
            set -eo pipefail
            echo "== CPU 训练冒烟门禁 =="
            # 逻辑集中在 scripts/cpu_training_smoke_gate.sh：CI 与本地同一条命令，
            # 避免"CI 里跑的口径"和"人本地复现的口径"漂移。
            bash scripts/cpu_training_smoke_gate.sh

  pull_request:
    - name: backend-test-pr
      <<: *main-env
    - name: cpu-training-smoke-pr
      <<: *cpu-training-env
      stages:
        - name: cpu-training-gate
          script: |
            set -eo pipefail
            bash scripts/cpu_training_smoke_gate.sh

# 云原生开发：点「云原生开发」按钮即建环境。
# 环境本身固化在 .ide/Dockerfile（控制面依赖 + Chromium + mjlab cpu extra 全在
# 镜像层），stages 只负责把后端拉起来并打印预览地址，不做重复安装。
$:
  vscode:
    - name: legged-studio-dev
      runner:
        cpus: 8
      docker:
        build: .ide/Dockerfile
      services:
        - vscode
        - docker
      env:
        # 镜像内已固化 CPU 训练 venv：进环境即可训练，无需重装。
        LEGGED_STUDIO_MJLAB_VENV: /opt/legged-studio/mjlab-cpu/.venv
        MUJOCO_GL: disabled
      docker.volumes:
        # 节点级缓存：同级路径，避免"路径包含关系"约束。
        - /root/.cache/pip
        - /root/.cache/ms-playwright
      stages:
        - name: start-control-plane
          script: |
            set -e
            echo "== Legged Studio 控制面启动 =="
            # 必须监听 0.0.0.0，否则 WebIDE 端口预览打不开
            python -m uvicorn backend.api_complete:app --host 0.0.0.0 --port 8765 --log-level warning &
            echo "backend pid=$!"
            for i in $(seq 1 30); do
              if curl -sf http://127.0.0.1:8765/health >/dev/null; then
                echo "backend ready"
                break
              fi
              sleep 1
            done
            # 端口预览地址：CNB_VSCODE_PROXY_URI 形如 https://xxx-{{port}}.cnb.run
            # 用 sed 做替换（不依赖 bash 的 ${var/pat/rep}，兼容 sh）。
            PREVIEW=$(printf '%s' "$CNB_VSCODE_PROXY_URI" | sed 's/{{port}}/8765/g')
            echo ""
            if [ -x "$LEGGED_STUDIO_MJLAB_VENV/bin/python" ]; then
              echo "CPU 训练: 就绪（$LEGGED_STUDIO_MJLAB_VENV）"
              echo "           冒烟: bash scripts/cpu_training_smoke_gate.sh"
            else
              echo "CPU 训练: 未供应（跑 scripts/provision_cpu_training.sh）"
            fi
            echo "工作台:   $PREVIEW/web/workbench.html"
            echo "sim2sim:  $PREVIEW/web/sim2sim/index.html"
            echo "API 文档: $PREVIEW/docs"
            echo "（也可在 WebIDE 的 PORTS 面板手动映射 8765）"
