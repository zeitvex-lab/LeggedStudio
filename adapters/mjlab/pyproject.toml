[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legged-studio-mjlab-adapter"
version = "0.1.0"
description = "Isolated MJLab worker environment for Legged Studio"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mjlab==1.6.0",
  # MicroDuck and other packages may declare BAM actuator models in their
  # package-owned extension. Install the MJLab-1.6-compatible main branch in
  # this isolated worker environment; the control plane remains lightweight.
  "better-actuator-models",
  "scipy>=1.15",
  "onnxruntime>=1.20,<2",
]

[tool.uv]
conflicts = [[{ extra = "cu128" }, { extra = "cpu" }]]

[project.optional-dependencies]
cu128 = ["torch>=2.7.0"]
cpu = ["torch>=2.7.0"]
dev = ["pytest>=9,<10"]

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com/"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
warp-lang = { index = "nvidia", marker = "sys_platform != 'darwin'" }
better-actuator-models = { git = "https://github.com/Rhoban/bam.git", branch = "main" }
torch = [
  { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform != 'darwin'" },
  { index = "pytorch-cpu", extra = "cpu" },
]

[tool.hatch.build.targets.wheel]
packages = ["."]
