<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>训练任务 - Legged Studio</title>
  <link rel="stylesheet" href="workbench.css">
  <link rel="stylesheet" href="play-overrides.css">
  <style>
    body.embedded .topbar, body.embedded .app-shell > .topbar { display: none; }
    body.embedded .list-container, body.embedded .content { padding-top: 14px; }
  
    .list-container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 40px 24px;
    }

    /* 汇总卡片 */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }

    .summary-card {
      padding: 16px 18px;
      background: var(--surface);
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      gap: 4px;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .summary-card:hover { border-color: var(--line); background: var(--surface-raised); }
    .summary-card.active { border-color: rgba(45, 212, 191, 0.55); background: rgba(45, 212, 191, 0.08); }

    .summary-card .value {
      font-size: 26px;
      font-weight: 700;
      font-family: 'SF Mono', Consolas, monospace;
      color: var(--text);
    }

    .summary-card.running .value { color: var(--cyan); }
    .summary-card.completed .value { color: var(--green); }
    .summary-card.failed .value { color: var(--red); }

    .summary-card .label {
      font-size: 12px;
      color: var(--muted);
    }

    /* 过滤栏 */
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .filter-bar select {
      min-height: 36px;
      padding: 0 10px;
      background: #111922;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      font-size: 13px;
    }

    .search-box {
      flex: 1;
      min-width: 220px;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 36px;
      padding: 0 12px;
      background: #111922;
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .search-box input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 13px;
      min-height: 34px;
    }

    .refresh-note {
      font-size: 12px;
      color: var(--faint);
      margin-left: auto;
      white-space: nowrap;
    }

    /* 表格 */
    .training-table {
      background: var(--surface);
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .table-header,
    .table-row {
      display: grid;
      grid-template-columns: 2.4fr 0.9fr 0.7fr 1fr 1.5fr 0.9fr 150px;
      gap: 14px;
      align-items: center;
      padding: 14px 20px;
    }

    .table-header {
      background: var(--surface-raised);
      border-bottom: 1px solid var(--line-soft);
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .table-row {
      border-bottom: 1px solid var(--line-soft);
      transition: background 0.15s ease;
      cursor: pointer;
    }

    .table-row:hover { background: var(--surface-raised); }
    .table-row:last-child { border-bottom: none; }

    .task-info { min-width: 0; }

    .task-info strong {
      display: block;
      font-size: 13px;
      margin-bottom: 3px;
      font-family: 'SF Mono', Consolas, monospace;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .task-info span {
      display: block;
      font-size: 11px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .cell-muted { font-size: 13px; color: var(--muted); }
    .cell-mono { font-size: 13px; font-family: 'SF Mono', Consolas, monospace; }

    .progress-cell { min-width: 0; }

    .progress-cell .pct-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      font-size: 12px;
      margin-bottom: 5px;
    }

    .progress-cell .pct { font-family: 'SF Mono', Consolas, monospace; font-weight: 600; }
    .progress-cell .eta { color: var(--faint); font-size: 11px; white-space: nowrap; }

    .progress-mini {
      width: 100%;
      height: 4px;
      background: var(--surface-soft);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-mini-bar {
      height: 100%;
      background: var(--cyan);
      border-radius: 2px;
      transition: width 0.3s ease;
    }

    .progress-mini-bar.completed { background: var(--green); }
    .progress-mini-bar.failed { background: var(--red); }

    .table-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn-small {
      padding: 5px 10px;
      font-size: 12px;
      min-height: 26px;
      min-width: 0;
    }

    .btn-small.danger { color: #fecaca; border-color: rgba(248, 113, 113, 0.35); }
    .btn-small.danger:hover { background: rgba(127, 29, 29, 0.25); border-color: rgba(248, 113, 113, 0.6); }

    /* 状态徽标（全部状态） */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid var(--line);
      color: var(--muted);
      background: var(--surface-raised);
      white-space: nowrap;
    }

    .status-badge .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--faint);
      flex-shrink: 0;
    }

    .status-badge.running { background: rgba(45, 212, 191, 0.12); color: var(--cyan); border-color: rgba(45, 212, 191, 0.35); }
    .status-badge.running .status-dot { background: var(--cyan); animation: tsui-breathe 1.5s ease-in-out infinite; }
    .status-badge.pending { color: #cbd5e1; }
    .status-badge.pending .status-dot { animation: tsui-breathe 1.5s ease-in-out infinite; }
    .status-badge.completed { background: rgba(94, 234, 212, 0.1); color: var(--green); border-color: rgba(94, 234, 212, 0.3); }
    .status-badge.completed .status-dot { background: var(--green); }
    .status-badge.failed { background: rgba(248, 113, 113, 0.12); color: var(--red); border-color: rgba(248, 113, 113, 0.35); }
    .status-badge.failed .status-dot { background: var(--red); }
    .status-badge.stopped { color: #fde68a; border-color: rgba(251, 191, 36, 0.3); }
    .status-badge.stopped .status-dot { background: #fbbf24; }
    .quality-chip { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px;
      font-size: 10px; vertical-align: 1px; border: 1px solid; }
    .quality-chip.q-ok { color: var(--green); border-color: rgba(94, 234, 212, 0.3); background: rgba(94, 234, 212, 0.08); }
    .quality-chip.q-warn { color: #fbbf24; border-color: rgba(251, 191, 36, 0.3); background: rgba(251, 191, 36, 0.08); }
    .quality-chip.q-bad { color: var(--red); border-color: rgba(248, 113, 113, 0.35); background: rgba(248, 113, 113, 0.1); }
    .quality-chip.q-mute { color: #94a3b8; border-color: rgba(148, 163, 184, 0.3); background: rgba(148, 163, 184, 0.08); }

    /* 与 training-common.js 注入的共享状态点动画保持一致（1.5s 呼吸） */
    @keyframes tsui-breathe {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    .empty-state p { margin-bottom: 16px; }
    .error-state { color: var(--red); }

    .table-footer {
      padding: 10px 20px;
      font-size: 11px;
      color: var(--faint);
      background: var(--surface-raised);
      border-top: 1px solid var(--line-soft);
    }

    @media (max-width: 1080px) {
      .table-header, .table-row { grid-template-columns: 2fr 1fr 1fr 1.2fr 140px; }
      .col-robot, .col-reward, .head-robot, .head-reward { display: none; }
    }

    @media (max-width: 680px) {
      .table-header, .table-row { grid-template-columns: 1.6fr 1fr 1.2fr 110px; }
      .col-algo, .head-algo { display: none; }
    }
  </style>
</head>
<body>
  <script>if (new URLSearchParams(location.search).get('embedded') === '1') document.body.classList.add('embedded');</script>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="dashboard.html" aria-label="Legged Studio 首页">
        <span class="brand-mark">LS</span>
        <span><strong>Legged Studio</strong><small>Training Console</small></span>
      </a>
      <nav class="main-nav" aria-label="主功能">
        <a class="nav-item" href="dashboard.html"><span class="nav-index">01</span>首页</a>
        <a class="nav-item" href="workbench.html#validate"><span class="nav-index">02</span>验证</a>
        <a class="nav-item" href="training_create.html?v=0.18.0"><span class="nav-index">03</span>训练配置</a>
        <a class="nav-item active" href="training_list.html?v=0.18.0"><span class="nav-index">04</span>训练</a>
        <a class="nav-item" href="workbench.html#simulation"><span class="nav-index">05</span>仿真</a>
      </nav>
      <div class="top-status"><span class="status-dot" id="planeDot"><i></i>Control plane</span></div>
    </header>
  <main class="content">
  <div class="list-container">
    <!-- T2.5：模块化资源包（模仿学习三线为对标两家均无的独有优势） -->
    <section class="pack-strip" id="packStrip" aria-label="模块化资源包"></section>
    <style>
      .pack-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; margin: 12px 0; }
      .pack-card { border: 1px solid var(--line-soft, #e8eff4); border-radius: 8px; background: #fff; padding: 10px 12px; }
      .pack-card strong { display: block; margin-bottom: 4px; color: #1d2935; }
      .pack-card .pack-desc { font-size: 12px; color: #5a6672; }
      .pack-card .pack-count { display: inline-block; margin-top: 6px; font-family: Consolas, monospace; font-size: 12px; color: #2e9e5b; }
      .pack-card .pack-manifest { list-style: none; margin: 8px 0 0; padding: 8px 0 0; border-top: 1px dashed var(--line-soft, #e8eff4); }
      .pack-card .pack-manifest li { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 3px 0; font-size: 11px; color: #5a6672; }
      .pack-card .pack-manifest code { color: #2478c5; font-size: 11px; }
      .pack-card .pack-manifest em { color: #d88922; font-style: normal; }
      .pack-card .pack-manifest b { margin-left: auto; color: #687582; font-family: Consolas, monospace; font-size: 10px; font-weight: 500; }
    </style>
    <!-- 页面头部 -->
    <header class="page-header">
      <div>
        <span class="page-kicker">Training</span>
        <h1>训练任务</h1>
        <p id="subtitle">管理所有训练任务</p>
      </div>
      <div class="page-actions">
        <a class="button primary" href="training_create.html?v=0.18.0">新建训练</a>
        <button class="button" onclick="refreshList()">刷新</button>
        <a class="button" href="dashboard.html">返回</a>
      </div>
    </header>

    <!-- 汇总卡片（点击即筛选） -->
    <div class="summary-grid" id="summaryGrid">
      <div class="summary-card" data-filter="all"><span class="value">-</span><span class="label">全部任务</span></div>
      <div class="summary-card running" data-filter="running"><span class="value">-</span><span class="label">运行中</span></div>
      <div class="summary-card completed" data-filter="completed"><span class="value">-</span><span class="label">已完成</span></div>
      <div class="summary-card failed" data-filter="failed"><span class="value">-</span><span class="label">失败</span></div>
      <div class="summary-card" data-filter="stopped"><span class="value">-</span><span class="label">已停止</span></div>
    </div>

    <!-- 过滤栏 -->
    <div class="filter-bar">
      <select id="filterStatus" onchange="refreshList()" title="按状态筛选">
        <option value="all">全部状态</option>
        <option value="running">运行中</option>
        <option value="completed">已完成</option>
        <option value="failed">失败</option>
        <option value="stopped">已停止</option>
      </select>
      <div class="search-box">
        <span style="color: var(--faint); font-size: 12px;">⌕</span>
        <input id="searchInput" type="text" placeholder="搜索任务 ID / 机器人 / 算法..." oninput="renderList()">
      </div>
      <span class="refresh-note" id="refreshNote">每 5 秒自动刷新</span>
    </div>

    <!-- 训练列表 -->
    <div class="training-table">
      <div class="table-header">
        <div>任务</div>
        <div class="head-robot">机器人</div>
        <div class="head-algo">算法</div>
        <div>状态</div>
        <div>进度</div>
        <div class="head-reward">平均奖励</div>
        <div>操作</div>
      </div>
      <div id="tableBody">
        <div class="empty-state">加载中...</div>
      </div>
      <div class="table-footer" id="tableFooter"></div>
    </div>
  </div>

  <script src="training-common.js"></script>
  <script>
    const {
      escapeHtml, fetchJson, statusBadge, fmtRelativeTime, fmtMetric, fmtDuration,
      statusInfo, RateTracker,
    } = window.TrainingUI;

    let allTasks = [];
    let loadError = null;
    let lastUpdated = null;
    const rateTrackers = new Map();  // task_id -> RateTracker

    function trackerFor(taskId) {
      if (!rateTrackers.has(taskId)) rateTrackers.set(taskId, new RateTracker(8));
      return rateTrackers.get(taskId);
    }

    async function loadResourcePacks() {
      const escapeHtml = (v) => String(v ?? '').replace(/[&<>"']/g, (ch) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
      const wrap = document.getElementById('packStrip');
      if (!wrap) return;
      try {
        const data = await fetchJson('/api/training/resource-packs');
        // #7 算法/资源包 manifest 卡片化：把资源包升级为"算法市场"卡片
        //（列出代表 task 的关键维度 + 演示入口），把家底变成可感知价值。
        wrap.innerHTML = (data.packs || []).map((pack) => {
          const reps = (pack.profiles || []).slice(0, 3).map((pf) =>
            `<li><code>${escapeHtml(pf.robot_id || '')}/${escapeHtml(pf.profile_id || '')}</code>
              <em>${escapeHtml(pf.algorithm || 'PPO')}</em>
              <b>${pf.num_envs || '-'}envs · ${pf.max_iterations || '-'}iters</b></li>`).join('');
          return `<div class="pack-card card-manifest">
            <strong>${escapeHtml(pack.name)}</strong>
            <span class="pack-desc">${escapeHtml(pack.description)}</span>
            <ul class="pack-manifest">${reps || '<li class="pack-count">暂无预设</li>'}</ul>
            <span class="pack-count">${pack.profile_count} 个预设 · 训练配置页可选</span>
          </div>`;
        }).join('');
      } catch (error) {
        wrap.innerHTML = '<div class="pack-card"><span class="pack-desc">资源包目录不可用（后端未启动）</span></div>';
      }
    }

    async function loadTrainingList() {
      try {
        const data = await fetchJson('/api/training/list');
        allTasks = data.tasks || [];
        loadError = null;
        lastUpdated = new Date();
        loadQualityBadges();
      } catch (error) {
        console.error('Failed to load training list:', error);
        loadError = error.message;
      }
      render();
    }

    // 质量徽章（清单 ⑥⑧）：并行拉每个任务的 preflight 探针 / ONNX 验收结论。
    // 失败静默——徽章缺失只影响信息密度，不影响列表可用性。
    let qualityByTask = {};
    let qualitySeq = 0;
    async function loadQualityBadges() {
      const seq = ++qualitySeq;
      const targets = allTasks.filter((t) => ['completed', 'stopped'].includes(String(t.status || '')));
      await Promise.all(targets.map(async (task) => {
        try {
          const res = await fetch(`/api/training/${encodeURIComponent(task.task_id)}/quality`);
          if (!res.ok) return;
          const data = await res.json();
          if (seq === qualitySeq) qualityByTask[task.task_id] = data.badges || {};
        } catch (_) { /* ignore */ }
      }));
      if (seq === qualitySeq) render();
    }

    function qualityBadges(taskId) {
      const badges = qualityByTask[taskId];
      if (!badges) return '';
      const chip = (cls, text, title) =>
        `<span class="quality-chip ${cls}" title="${title}">${text}</span>`;
      let html = '';
      if (badges.preflight === 'pass') html += chip('q-ok', '预检', '训练前物理可达性预检通过（开环动作包络扫描）');
      else if (badges.preflight === 'warn') html += chip('q-warn', '预检', '预检警告：部分动作幅值下姿态/高度接近边界');
      else if (badges.preflight === 'error') html += chip('q-bad', '预检', '预检执行失败（详见 native_preflight.json）');
      if (badges.acceptance === 'pass') html += chip('q-ok', '验收', 'ONNX 策略验收全部指令模式通过');
      else if (badges.acceptance === 'fail') html += chip('q-bad', '验收', 'ONNX 策略验收存在未通过指令模式');
      else if (badges.acceptance === 'not_evaluated') html += chip('q-mute', '验收', '已导出 ONNX，尚未运行验收评估');
      return html;
    }

    function refreshList() {
      loadTrainingList();
      loadResourcePacks();
    }

    function progressMeta(task) {
      const progress = Number(task.progress || 0);
      const pct = Math.max(0, Math.min(1, Number.isFinite(progress) ? progress : 0)) * 100;
      const current = Number(task.current_iteration || 0);
      const max = Number(task.max_iterations || 0);
      const tracker = trackerFor(task.task_id);
      tracker.push(current);
      const rate = tracker.rate();

      let etaText = '';
      const info = statusInfo(task.status);
      if (info.cls === 'running') {
        if (rate != null && max > current) {
          etaText = `ETA ${fmtDuration(tracker.eta(max))}`;
        } else if (rate == null) {
          etaText = '估算中';
        }
      }
      const speedText = info.cls === 'running' && rate != null ? `${(rate * 60).toFixed(1)} it/min` : '';
      return { pct, current, max, etaText, speedText };
    }

    function taskSubtitle(task) {
      const config = task.config || {};
      const parts = [];
      if (config.task_name) parts.push(String(config.task_name));
      if (config.num_envs) parts.push(`${config.num_envs} envs`);
      if (task.created_at) parts.push(fmtRelativeTime(task.created_at));
      return parts.join(' · ');
    }

    function filteredTasks() {
      const statusFilter = document.getElementById('filterStatus').value;
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      return allTasks.filter((task) => {
        if (statusFilter !== 'all' && statusInfo(task.status).cls !== statusFilter) return false;
        if (!query) return true;
        const haystack = [task.task_id, task.robot, task.algorithm, (task.config || {}).task_name]
          .filter(Boolean).join(' ').toLowerCase();
        return haystack.includes(query);
      });
    }

    function render() {
      renderSummary();

      const tasks = filteredTasks();
      const total = allTasks.length;
      document.getElementById('subtitle').textContent = `共 ${total} 个任务 · 展示 ${tasks.length} 个`;

      const footer = document.getElementById('tableFooter');
      footer.textContent = lastUpdated
        ? `最后更新 ${lastUpdated.toLocaleTimeString('zh-CN', { hour12: false })} · 每 5 秒自动刷新`
        : '';

      const tableBody = document.getElementById('tableBody');

      if (loadError && !total) {
        tableBody.innerHTML = `
          <div class="empty-state error-state">
            <p>加载失败: ${escapeHtml(loadError)}</p>
            <button class="button" onclick="refreshList()">重试</button>
          </div>`;
        return;
      }

      if (!total) {
        tableBody.innerHTML = `
          <div class="empty-state">
            <p>暂无训练任务</p>
            <a class="button primary" href="training_create.html?v=0.18.0">创建第一个训练</a>
          </div>`;
        return;
      }

      if (!tasks.length) {
        tableBody.innerHTML = `<div class="empty-state"><p>没有匹配当前筛选的任务</p></div>`;
        return;
      }

      tableBody.innerHTML = tasks.map((task) => {
        const meta = progressMeta(task);
        const info = statusInfo(task.status);
        const canStop = info.cls === 'running' || info.cls === 'pending';
        const canDelete = info.cls !== 'running';
        const progressCell = `
          <div class="progress-cell">
            <div class="pct-row">
              <span class="pct">${meta.pct.toFixed(1)}%</span>
              <span class="eta">${escapeHtml(meta.etaText || (meta.max ? `${meta.current}/${meta.max}` : ''))}</span>
            </div>
            <div class="progress-mini">
              <div class="progress-mini-bar ${info.cls}" style="width: ${info.cls === 'completed' ? 100 : meta.pct}%;"></div>
            </div>
            <span style="display:block; font-size:10px; color: var(--faint); margin-top:4px;">${escapeHtml(meta.speedText)}</span>
          </div>`;
        return `
          <div class="table-row" onclick="viewTask('${escapeHtml(task.task_id)}')" title="点击查看监控页面">
            <div class="task-info">
              <strong title="${escapeHtml(task.task_id)}">${escapeHtml(task.task_id)}</strong>
              <span>${escapeHtml(taskSubtitle(task))}${qualityBadges(task.task_id)}</span>
            </div>
            <div class="cell-muted col-robot">${escapeHtml(task.robot || 'Unknown')}</div>
            <div class="cell-muted col-algo">${escapeHtml(task.algorithm || 'PPO')}</div>
            <div>${statusBadge(task.status)}</div>
            ${progressCell}
            <div class="cell-mono col-reward" title="最近一次汇报的平均奖励">${escapeHtml(fmtMetric(task.reward))}</div>
            <div class="table-actions" onclick="event.stopPropagation()">
              <button class="btn btn-small" onclick="viewTask('${escapeHtml(task.task_id)}')">查看</button>
              ${canStop ? `<button class="btn btn-small" onclick="stopTask('${escapeHtml(task.task_id)}')">停止</button>` : ''}
              ${canDelete ? `<button class="btn btn-small danger" onclick="deleteTask('${escapeHtml(task.task_id)}')" title="从列表移除该任务记录">删除</button>` : ''}
            </div>
          </div>`;
      }).join('');
    }

    function renderList() { render(); }

    function renderSummary() {
      const counts = { all: allTasks.length, running: 0, completed: 0, failed: 0, stopped: 0 };
      allTasks.forEach((task) => {
        const cls = statusInfo(task.status).cls;
        if (counts[cls] !== undefined) counts[cls] += 1;
      });
      document.querySelectorAll('.summary-card').forEach((card) => {
        const key = card.dataset.filter;
        card.querySelector('.value').textContent = counts[key] !== undefined ? counts[key] : 0;
        card.classList.toggle('active', document.getElementById('filterStatus').value === key);
      });
    }

    document.querySelectorAll('.summary-card').forEach((card) => card.addEventListener('click', () => {
      document.getElementById('filterStatus').value = card.dataset.filter;
      render();
    }));

    function viewTask(taskId) {
      window.location.href = `training_monitor.html?task_id=${encodeURIComponent(taskId)}`;
    }

    async function stopTask(taskId) {
      if (!confirm(`确定要停止训练任务 ${taskId} 吗？`)) return;
      try {
        const data = await fetchJson(`/api/training/${encodeURIComponent(taskId)}/stop`, { method: 'POST' });
        if (data.success) loadTrainingList();
      } catch (error) {
        alert('停止失败: ' + error.message);
      }
    }

    async function deleteTask(taskId) {
      if (!confirm(`确定要从列表删除任务 ${taskId} 吗？\n（仅移除任务记录，不会删除工作区文件）`)) return;
      try {
        const data = await fetchJson(`/api/training/${encodeURIComponent(taskId)}`, { method: 'DELETE' });
        if (data.success) {
          rateTrackers.delete(taskId);
          loadTrainingList();
        }
      } catch (error) {
        alert('删除失败: ' + error.message);
      }
    }

    // 初始加载 + 定时刷新（页面隐藏时暂停，回到前台立即刷新一次）
    loadTrainingList();
    loadResourcePacks();
    const refreshTimer = setInterval(() => {
      if (!document.hidden) loadTrainingList();
    }, 5000);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) loadTrainingList();
    });
    window.addEventListener('beforeunload', () => clearInterval(refreshTimer));
  </script>
  </div>
  </main>
  </div>
<script>
    fetch('/health').then((r) => { const dot = document.getElementById('planeDot'); if (dot) dot.classList.add(r.ok ? 'ok' : 'error'); }).catch(() => { const dot = document.getElementById('planeDot'); if (dot) dot.classList.add('error'); });
  </script>
</body>
</html>
