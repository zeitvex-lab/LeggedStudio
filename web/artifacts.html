<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>策略产物 - Legged Studio</title><link rel="stylesheet" href="shared/ui.css"><style>.artifact-shell{max-width:1200px;margin:0 auto;padding:32px 24px}.artifact-list{display:grid;gap:12px;margin-top:20px}.artifact-row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px;border:1px solid var(--border-soft);border-radius:var(--radius);background:var(--surface)}.artifact-row strong,.artifact-row small{display:block}.artifact-row small{margin-top:6px;color:var(--muted)}.artifact-actions{display:flex;gap:8px;flex-wrap:wrap}.empty{padding:48px;text-align:center;color:var(--muted)}</style><style>body.embedded{padding:0}body.embedded .artifact-shell{padding:16px 20px 40px}body.embedded .page-actions a[href="workbench.html#home"]{display:none}</style></head><body><script>if(new URLSearchParams(location.search).get("embedded")==="1"){document.body.classList.add("embedded");}</script><main class="artifact-shell"><header class="page-header"><div><span class="page-kicker">Policy Artifacts</span><h1>策略产物</h1><p>管理 PyTorch checkpoint、PolicyArtifact 和 ONNX 导出。</p></div><div class="page-actions"><a class="btn" href="workbench.html#home">返回</a><button class="btn" id="refresh">刷新</button></div></header><section id="list" class="artifact-list"><div class="empty">加载中...</div></section></main><script src="shared/api.js"></script><script src="shared/feedback.js"></script><script>
const API=(location.protocol==='http:'||location.protocol==='https:')?location.origin:'http://127.0.0.1:8765',listEl=document.querySelector('#list');
async function load(){
  let runs, exportList;
  try{
    // 读取失败必须可见：此前这里不查 res.ok，后端 500 时页面显示"暂无训练产物"（把故障伪装成空数据）。
    [runs, exportList] = await Promise.all([LSApi.fetchJson(API+'/api/training/list'), LSApi.fetchJson(API+'/api/export/list')]);
  }catch(error){
    listEl.innerHTML = `<div class="empty">训练产物读取失败：${error.message}</div>`;
    LSFeedback.error('训练产物读取失败：' + error.message);
    return;
  }
  const exported=new Map((exportList.exports||[]).map(x=>[x.task_id,x]));
  const tasks=runs.tasks||[];
  listEl.innerHTML=tasks.length?tasks.map(t=>{const e=exported.get(t.task_id);return `<article class="artifact-row"><div><strong>${t.robot||'-'} · ${t.task_id}</strong><small>${t.algorithm||'PPO'} · ${t.status} · ${(Number(t.progress||0)*100).toFixed(1)}%</small></div><div class="artifact-actions"><button class="btn" data-export="${t.task_id}" ${t.status==='completed'?'':'disabled'}>${e?'重新导出 ONNX':'导出 ONNX'}</button>${e?`<a class="btn" href="${API}/api/export/${encodeURIComponent(t.task_id)}/download">下载 ONNX</a>`:''}</div></article>`}).join(''):'<div class="empty">暂无训练产物</div>';
  document.querySelectorAll('[data-export]').forEach(b=>b.onclick=async()=>{
    b.disabled=true;b.textContent='导出中...';
    try{
      await LSApi.fetchJson(API+'/api/export/'+encodeURIComponent(b.dataset.export)+'/export-onnx',{method:'POST'});
      b.textContent='导出完成';
      load();
    }catch(error){
      b.textContent='导出失败';
      LSFeedback.error('导出失败：' + error.message);
    }finally{
      b.disabled=false;
    }
  });
}
document.querySelector('#refresh').onclick=load;load();
</script></body></html>
