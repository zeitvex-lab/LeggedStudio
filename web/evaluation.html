<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sim2Sim 验证 - Legged Studio</title><link rel="stylesheet" href="dashboard.css"><style>
.eval-shell{max-width:1180px;margin:0 auto;padding:32px 24px}.eval-form,.result{padding:20px;border:1px solid var(--border-soft);border-radius:var(--radius);background:var(--surface);margin-top:18px}.eval-form{display:flex;gap:12px;align-items:end;flex-wrap:wrap}.eval-form label{display:grid;gap:6px;color:var(--muted);font-size:12px}.eval-form select,.eval-form input{min-height:38px;padding:0 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface-input);color:var(--text)}.result-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:14px}.metric{padding:14px;border:1px solid var(--border-soft);border-radius:var(--radius);background:var(--surface-raised)}.metric span{display:block;color:var(--muted);font-size:11px}.metric strong{display:block;margin-top:4px;font-size:22px;color:var(--accent)}
</style></head><body><main class="eval-shell"><header class="page-header"><div><span class="page-kicker">Sim2Sim</span><h1>策略验证</h1><p>使用训练产物在本地 Contract-MuJoCo 环境运行确定性回放。</p></div><div class="page-actions"><a class="btn" href="dashboard.html">返回</a></div></header><section class="eval-form"><label>训练产物<select id="task"><option>加载中...</option></select></label><label>回放回合<input id="episodes" type="number" value="5" min="1" max="100"></label><button class="btn primary" id="run">运行验证</button></section><section class="result" id="result"><div class="empty-state">选择已完成任务后开始验证</div></section></main><script>
const API='http://127.0.0.1:8765',taskEl=document.querySelector('#task'),resultEl=document.querySelector('#result');async function load(){const r=await fetch(API+'/api/evaluation/list');const d=await r.json();taskEl.innerHTML=(d.tasks||[]).map(x=>`<option value="${x.task_id}">${x.robot} · ${x.task_id}</option>`).join('')||'<option value="">暂无可评估产物</option>'}async function run(){if(!taskEl.value)return;resultEl.innerHTML='<div class="empty-state">评估运行中...</div>';const r=await fetch(API+'/api/evaluation/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task_id:taskEl.value,episodes:Number(document.querySelector('#episodes').value)})});const d=await r.json();if(!r.ok){resultEl.innerHTML=`<div class="empty-state">${d.detail||'评估失败'}</div>`;return}const x=d.result;resultEl.innerHTML=`<h2>${x.robot}</h2><p>${x.evaluated_env} · ${x.episodes} episodes</p><div class="result-grid"><div class="metric"><span>平均奖励</span><strong>${x.avg_reward.toFixed(3)}</strong></div><div class="metric"><span>奖励标准差</span><strong>${x.std_reward.toFixed(3)}</strong></div><div class="metric"><span>平均前进速度</span><strong>${x.avg_forward_velocity.toFixed(3)}</strong></div><div class="metric"><span>成功率</span><strong>${(x.success_rate*100).toFixed(1)}%</strong></div></div>`}document.querySelector('#run').onclick=run;load();
</script></body></html>
