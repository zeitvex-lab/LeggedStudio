<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>机器人资产 - Legged Studio</title><link rel="stylesheet" href="dashboard_v2.css"><style>
.assets-shell{max-width:1440px;margin:0 auto;padding:32px 24px}.filter-bar{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}.filter-bar select,.filter-bar input{min-height:38px;padding:0 11px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface-input);color:var(--text)}.asset-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.asset-card{padding:18px;border:1px solid var(--border-soft);border-radius:var(--radius);background:var(--surface);cursor:pointer}.asset-card:hover,.asset-card.selected{border-color:var(--accent)}.asset-card h3{margin:0 0 7px;font-size:16px}.asset-card p{margin:5px 0;color:var(--muted);font-size:12px}.asset-card code{display:block;max-width:100%;margin-top:12px;font-size:11px}.detail{margin-top:20px;padding:20px;border:1px solid var(--border-soft);border-radius:var(--radius);background:var(--surface);min-height:120px}.badge{display:inline-flex;padding:3px 8px;border-radius:99px;background:var(--surface-raised);color:var(--accent);font-size:11px}.empty{padding:48px;text-align:center;color:var(--muted)}
</style></head>
<body><main class="assets-shell"><header class="page-header"><div><span class="page-kicker">Asset Inventory</span><h1>机器人资产</h1><p>参考 1000framesAI 的机器人配置步骤，浏览本地扫描清单和可训练 preset。</p></div><div class="page-actions"><a class="btn" href="dashboard_v2.html">返回</a><button class="btn" id="refresh">刷新</button></div></header><div class="filter-bar"><input id="family" placeholder="family 过滤"><select id="size"><option value="">全部体型</option><option>S</option><option>M</option><option>L</option></select><select id="locomotion"><option value="">全部构型</option><option value="point_foot">点足</option><option value="wheeled_leg">轮足</option></select><select id="readiness"><option value="">全部就绪度</option><option value="direct_mujoco_candidate">可直接加载</option><option value="adapter_required">需适配</option><option value="morphology_only">仅形态</option></select></div><section id="assetList" class="asset-grid"><div class="empty">加载中...</div></section><section id="detail" class="detail"><div class="empty">选择资产查看详情</div></section></main><script>
const API='http://127.0.0.1:8765';const $=s=>document.querySelector(s);let records=[];
async function load(){const q=new URLSearchParams();for(const id of ['family','size','locomotion','readiness']){const v=$( '#'+id).value.trim();if(v)q.set(id,v)}const r=await fetch(`${API}/api/assets?limit=500&${q}`);const d=await r.json();records=d.records||[];$('#assetList').innerHTML=records.length?records.map((x,i)=>`<article class="asset-card" data-index="${i}"><h3>${x.family||x.model_name||'未命名'}</h3><span class="badge">${x.size_class_by_mass||'?' } · ${x.locomotion||'?'}</span><p>${x.format||''} · ${x.readiness||''} · ${x.actuated_joint_count||0} DOF</p><p>${x.classification_mass_kg?Number(x.classification_mass_kg).toFixed(3)+' kg':'质量未知'}</p><code>${x.path||''}</code></article>`).join(''):'<div class="empty">没有匹配资产</div>';document.querySelectorAll('.asset-card').forEach(c=>c.onclick=()=>show(Number(c.dataset.index)));}
function show(i){const x=records[i];document.querySelectorAll('.asset-card').forEach(c=>c.classList.remove('selected'));document.querySelector(`[data-index="${i}"]`)?.classList.add('selected');$('#detail').innerHTML=`<h2>${x.family||x.model_name||'未命名'}</h2><p>${x.path||''}</p><p>格式：${x.format||'-'} · 就绪度：${x.readiness||'-'} · 质量：${x.classification_mass_kg||'-'} kg</p><p>关节：${(x.joint_names||[]).join('、')||'未记录'}</p><p>MuJoCo：${x.mujoco_probe?.status||'未探测'} · mesh 缺失：${x.missing_mesh_ref_count??'-'}</p>`}
['family','size','locomotion','readiness'].forEach(id=>$('#'+id).onchange=load);$('#family').oninput=()=>{clearTimeout(window.t);window.t=setTimeout(load,250)};$('#refresh').onclick=load;load();
</script></body></html>
