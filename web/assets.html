<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>包管理 - Legged Studio</title>
  <link rel="stylesheet" href="dashboard.css">
  <style>
    .packages-shell{max-width:1320px;margin:0 auto;padding:32px 24px}.package-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-top:22px}.package-card{padding:18px;border:1px solid var(--border-soft);border-radius:var(--radius);background:var(--surface)}.package-card h3{margin:0 0 7px}.package-card p{margin:6px 0;color:var(--muted);font-size:12px}.package-card code{display:block;margin-top:12px;color:var(--muted);font-size:11px;word-break:break-all}.package-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.package-actions{display:flex;gap:8px;margin-top:15px}.badge{display:inline-flex;padding:3px 8px;border-radius:99px;background:var(--surface-raised);color:var(--accent);font-size:11px}.empty{padding:60px;text-align:center;color:var(--muted);border:1px dashed var(--border-soft)}
  </style>
</head>
<body>
  <main class="packages-shell">
    <header class="page-header">
      <div><span class="page-kicker">Package Manager</span><h1>包管理</h1><p>管理本地持久化的导入包。每个包可包含模型、网格、Contract、训练配置和仿真配置。</p></div>
      <div class="page-actions"><a class="btn" href="workbench.html#home">返回工作台</a><button class="btn" id="refresh">刷新</button></div>
    </header>
    <section id="packageList" class="package-grid"><div class="empty">正在读取本地包...</div></section>
  </main>
  <script>
    const API=window.location.origin,$=s=>document.querySelector(s);
    function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    async function load(){
      const list=$('#packageList');list.innerHTML='<div class="empty">正在读取本地包...</div>';
      try{
        const response=await fetch(API+'/api/project/packages');const data=await response.json();const packages=data.packages||[];
        list.innerHTML=packages.length?packages.map(item=>{const c=item.contract||{},p=item.robot_package||{},model=p.model||{};return `<article class="package-card"><div class="package-head"><div><h3>${esc(c.family||c.robot_id||item.package_id)}</h3><span class="badge">${esc(item.source==='imported'?'已导入':'工作区')}</span></div><span class="badge">${esc(c.urdf?.format||model.format||'robot package')}</span></div><p>${esc(item.file_count)} 个文件 · ${(Number(item.size_bytes||0)/1048576).toFixed(2)} MB</p><p>关节 ${esc(c.joints?.actuated_joints?.length||0)} · Contract ${esc(c.contract_id||'-')}</p><p>模型 ${esc(c.urdf?.path||model.path||'未声明')}</p><code>${esc(item.package_root)}</code><div class="package-actions"><a class="btn" href="workbench.html#validate">打开验证</a><button class="btn" data-delete="${esc(item.package_id)}">删除</button></div></article>`}).join(''):'<div class="empty">暂无包。请在验证模块选择本地资产文件夹。</div>';
        list.querySelectorAll('[data-delete]').forEach(button=>button.onclick=async()=>{if(!confirm('确认删除这个包？'))return;const result=await fetch(API+'/api/project/packages/'+encodeURIComponent(button.dataset.delete),{method:'DELETE'});if(result.ok)load();});
      }catch(error){list.innerHTML='<div class="empty">包列表读取失败：'+esc(error.message)+'</div>';}
    }
    $('#refresh').onclick=load;load();
  </script>
</body>
</html>
