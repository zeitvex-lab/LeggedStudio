<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>包管理 - Legged Studio</title>
  <link rel="stylesheet" href="shared/ui.css">
  <style>
    .packages-shell{max-width:1320px;margin:0 auto;padding:32px 24px}
    .package-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;margin-top:22px}
    .package-card{padding:18px;border:1px solid var(--border-soft);border-radius:var(--radius);background:var(--surface);overflow-wrap:anywhere}
    .package-card h3{margin:0 0 7px}
    .package-card p{margin:6px 0;color:var(--muted);font-size:12px}
    .package-card .morph-line{margin:2px 0 4px}
    .package-card .morph-line b{font-family:ui-monospace,monospace;color:var(--accent,#39c5bb)}
    .package-card code{display:block;margin-top:12px;color:var(--muted);font-size:11px;word-break:break-all}
    .package-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
    .package-actions{display:flex;gap:8px;margin-top:15px;flex-wrap:wrap}
    .badge{display:inline-flex;padding:3px 8px;border-radius:99px;background:var(--surface-raised);color:var(--accent);font-size:11px}
    .badge.ok{background:var(--ls-ok-soft);color:var(--ls-ok)}
    .badge.warn{background:var(--ls-warn-soft);color:var(--ls-warn)}
    .badge.readonly{background:var(--surface-raised);color:var(--muted)}
    .empty{padding:60px;text-align:center;color:var(--muted);border:1px dashed var(--border-soft)}
    .import-bar{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
    .import-bar input{flex:1;min-width:280px;padding:9px 12px;border:1px solid var(--border-soft);border-radius:var(--radius);background:var(--surface);color:var(--text);font-size:12px}
    .btn.primary{background:var(--accent);color:#ffffff;border-color:var(--accent)}
    /* 删除按钮：旧 #f85149 在浅底上只有 3.35:1（实测门禁红），改用 ui.css 语义红 */
    .btn.danger{color:var(--ls-err);border-color:var(--ls-err-line)}
    .profile-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
    .profile-chips .badge{font-size: 11px}
    .toolbar-note{margin-top:10px;color:var(--muted);font-size:11px}
  
    body.embedded{padding:0}
    body.embedded .packages-shell{padding:18px 20px 40px}
    body.embedded .page-actions a[href^="workbench"]{display:none}
  </style>
</head>
<script>if(new URLSearchParams(location.search).get("embedded")==="1"){document.body.classList.add("embedded");}</script>
  <main class="packages-shell">
    <header class="page-header">
      <div><span class="page-kicker">Package Manager</span><h1>包管理</h1><p>统一管理机器人包：内置包与工作区包自动合并展示，新增/修改会自动同步到训练配置与仿真页。支持从本地路径导入、导出与删除。</p></div>
      <div class="page-actions"><a class="btn" href="workbench.html#home">返回工作台</a><button class="btn" id="refresh">刷新索引</button></div>
    </header>
    <div class="import-bar">
      <input id="importPath" aria-label="导入包的文件路径" type="text" placeholder="输入机器人包的绝对路径（目录需包含 contract_legacy_v2.json 与 robot_package.json），例如 C:\data\my_robot_pkg" spellcheck="false">
      <button class="btn primary" id="importBtn">导入包</button>
    </div>
    <p class="toolbar-note">索引具备自动同步：任何包新增/修改/删除都会在下一次读取时被检测并重建，无需手动刷新。内置包（assets/robots）为只读。</p>
    <section id="packageList" class="package-grid"><div class="empty">正在读取机器人包...</div></section>
  </main>
  <script src="shared/api.js"></script>
  <script src="shared/feedback.js"></script>
  <script>
    const API=window.location.origin,$=s=>document.querySelector(s);
    function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    async function load(){
      const list=$('#packageList');list.innerHTML='<div class="empty">正在读取机器人包...</div>';
      try{
        const data=await LSApi.fetchJson(API+'/api/robots/presets');
        const packages=(data.presets||[]).slice().sort((a,b)=>String(a.robot_id).localeCompare(String(b.robot_id)));
        list.innerHTML=packages.length?packages.map(item=>{
          const pkg=item.robot_package||{},root=pkg.package_root||'';
          const isWorkspace=root.replace(/\\/g,'/').includes('/workspace/packages');
          const profiles=item.training_profiles||[];
          const profileChips=profiles.length?`<div class="profile-chips">${profiles.map(p=>`<span class="badge ${p.valid===false?'warn':'ok'}" title="${esc(p.validation_errors&&p.validation_errors.length?p.validation_errors.join('; '):'校验通过')}">${esc(p.profile_id||'?')}${p.valid===false?'（校验失败）':''}</span>`).join('')}</div>`:'<p>无训练档案</p>';
          const actions=`<div class="package-actions">
            <a class="btn" href="/api/robots/packages/${esc(item.robot_id)}/export">导出 zip</a>
            <a class="btn" href="training_create.html?robot=${esc(item.robot_id)}${document.body.classList.contains('embedded')?'&embedded=1':''}">配置训练</a>
            ${isWorkspace?`<button class="btn danger" data-delete="${esc(item.robot_id)}">删除</button>`:'<span class="badge readonly">内置 · 只读</span>'}
          </div>`;
          const morph=item.morphology||{};
          const morphLine=morph.source==='contract_truth'?`<p class="morph-line">形态 <b>${esc(morph.id||'-')}</b> · ${morph.legs??'-'} 腿 · 角色 ${(morph.roles||[]).map(esc).join('/')||'-'} · ${esc(morph.actuator_type||'-')} · ${esc(morph.foot_type||'-')}足${morph.wheel_count?` · 轮组 ${morph.wheel_count}`:''}</p>`:'';
          return `<article class="package-card" data-robot="${esc(item.robot_id)}">
            <div class="package-head"><div><h3>${esc(item.family||item.robot_id)}</h3><span class="badge">${esc(item.robot_id)}</span></div>
            <span class="badge ${isWorkspace?'':'readonly'}">${isWorkspace?'工作区':'内置'}</span></div>
            <p>${esc(item.dof??'-')} 自由度 · ${Number(item.mass_kg||0).toFixed(2)} kg · ${esc(item.size_class||'-')}/${esc(item.locomotion_type||'-')} · ${profiles.length} 个训练档案</p>
            ${morphLine}
            ${profileChips}
            <code>${esc(root||'-')}</code>${actions}
          </article>`}).join(''):'<div class="empty">没有机器人包。可在上方输入路径导入，或将包放入工作区 packages/ 目录。</div>';
        list.querySelectorAll('[data-delete]').forEach(button=>button.onclick=async()=>{
          if(!await LSFeedback.confirm('确认删除该工作区包？（内置包不受影响）',{title:'删除工作区包',danger:true}))return;
          try{
            await LSApi.fetchJson(API+'/api/robots/packages/'+encodeURIComponent(button.dataset.delete),{method:'DELETE'});
            LSFeedback.toast('已删除工作区包：'+button.dataset.delete,{type:'ok'});
          }catch(error){
            LSFeedback.error('删除失败：'+error.message);
          }
          load();
        });
      }catch(error){list.innerHTML='<div class="empty">包列表读取失败：'+esc(error.message)+'</div>';}
    }
    $('#refresh').onclick=async()=>{
      const btn=$('#refresh');btn.disabled=true;const old=btn.textContent;btn.textContent='重建中...';
      try{const d=await LSApi.fetchJson(API+'/api/robots/packages/refresh',{method:'POST'});
        btn.textContent=`已同步 ${d.count||0} 个`;}catch(error){btn.textContent='刷新失败';LSFeedback.error('刷新失败：'+error.message);}
      setTimeout(()=>{btn.disabled=false;btn.textContent=old;load();},900);
    };
    $('#importBtn').onclick=async()=>{
      const input=$('#importPath');const path=input.value.trim();
      if(!path){LSFeedback.error('请先输入机器人包目录的绝对路径');return;}
      const btn=$('#importBtn');btn.disabled=true;const old=btn.textContent;btn.textContent='导入中...';
      try{
        const d=await LSApi.fetchJson(API+'/api/robots/packages/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path})});
        input.value='';
        LSFeedback.toast(`已导入 ${d.robot_id}\n档案：${(d.record_summary&&d.record_summary.profiles||[]).join(', ')||'无'}`,{type:'ok'});
      }catch(error){
        LSFeedback.error('导入失败：'+error.message);
      }
      btn.disabled=false;btn.textContent=old;load();
    };
    load();
  </script>
</body>
</html>
