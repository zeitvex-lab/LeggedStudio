<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>高级仿真 · Legged Studio</title>
  <link rel="stylesheet" href="shared/ui.css">
  <style>
    /* S5：本页从"只铺满 iframe 的壳"升级为 **Scenario 编辑器**（地图 / 传感器 / 任务 / 判据），
       视口仍是同一个仿真内核（右侧 iframe），编辑器按场景契约生成参数后重写它的 URL。

       为什么编辑器在**壳页**而不是塞进仿真页内：仿真是"跑一份场景"的执行器，场景编辑是
       "写一份场景"的创作面，两者生命周期不同（编辑不该打断正在跑的仿真）；而且壳页天然
       能把「校验不通过就不许启动」做在按钮上（S2② 的前端半边）。 */
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column; overflow: hidden;
      background: var(--bg, #0b1319); color: var(--text, #e6eef4);
    }
    .adv-bar {
      display: flex; align-items: center; gap: 10px; flex: 0 0 auto;
      padding: 7px 12px; border-bottom: 1px solid var(--border-soft, #23303a);
      background: var(--surface, #101a22); font-size: 12px;
    }
    .adv-bar strong { font-size: 13px; }
    .adv-bar .hint { color: var(--muted, #8ea1ae); }
    .adv-bar .spacer { flex: 1; }
    .adv-btn {
      display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px;
      border: 1px solid var(--border, #2c3a45); border-radius: var(--radius, 6px);
      background: var(--surface-raised, #16222b); color: inherit;
      font-size: 12px; text-decoration: none; cursor: pointer;
    }
    .adv-btn:hover { border-color: var(--accent, #2588df); }
    .adv-btn:disabled { opacity: .45; cursor: not-allowed; }
    #scTaskPlugin, #scTaskFill { min-height: 26px; }
    .adv-btn.primary { border-color: var(--accent, #2588df); }

    /* **仿真视口永远占满宽度**（2026-09-23 用户口径：编辑器原先 `flex: 0 0 340px` 实占布局，
       一打开就把机器人视口挤掉 340px，"非常突兀、大幅挤占仿真空间"）。改成**浮层 + 可收起**：
       编辑器浮在仿真之上（`.adv-editor.open` 才滑入），默认收起，选择记在 localStorage；
       顶栏常驻「启动仿真」，收起后也照常能跑（不然配置完还得再展开一次才能启动）。 */
    .adv-body { position: relative; display: flex; flex: 1 1 auto; min-height: 0; }
    .adv-editor {
      position: absolute; top: 0; bottom: 0; left: 0; z-index: 6;
      width: min(360px, 92vw); overflow-y: auto; padding: 10px 12px 24px;
      border-right: 1px solid var(--border-soft, #23303a); background: var(--surface, #101a22);
      box-shadow: 0 10px 30px rgba(0, 0, 0, .45);
      font-size: 12px;
      transform: translateX(-102%); transition: transform .18s ease;
      visibility: hidden;
    }
    .adv-editor.open { transform: none; visibility: visible; }
    @media (prefers-reduced-motion: reduce) { .adv-editor { transition: none; } }
    /* 顶栏的常驻启动按钮与编辑器内的那个同权（两处都会随校验结果同步禁用态） */
    .adv-bar .adv-btn.primary:disabled { opacity: .45; cursor: not-allowed; }
    .adv-editor section { margin-bottom: 14px; }
    .adv-editor h3 {
      margin: 0 0 6px; font-size: 12px; font-weight: 600; letter-spacing: .02em;
      color: var(--accent, #2588df); text-transform: none;
    }
    .adv-editor label { display: block; margin: 6px 0 2px; color: var(--muted, #8ea1ae); }
    .adv-editor input[type="text"], .adv-editor input[type="number"],
    .adv-editor select, .adv-editor textarea {
      width: 100%; box-sizing: border-box; padding: 4px 6px;
      border: 1px solid var(--border, #2c3a45); border-radius: 4px;
      background: var(--bg, #0b1319); color: inherit; font-size: 12px;
    }
    .adv-editor textarea { min-height: 62px; resize: vertical; font-family: ui-monospace, monospace; }
    .adv-editor .row { display: flex; gap: 6px; }
    .adv-editor .row > * { flex: 1; }
    .adv-editor .inline { display: flex; align-items: center; gap: 6px; margin-top: 6px; color: var(--text); }
    .adv-editor .inline input { width: auto; }
    .adv-editor .note { color: var(--muted, #8ea1ae); font-size: 11px; line-height: 1.5; margin-top: 6px; }
    /* 步骤条（范式抄 references_1000framesai/shared_nav.js 的 STEPS：加一段 = 表加一条） */
    .adv-editor .sc-steps { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
    .adv-editor .sc-step {
      flex: 0 0 auto; padding: 3px 8px; font-size: 11px; cursor: pointer; min-height: 26px;
      border: 1px solid var(--border, #2c3a45); border-radius: 999px;
      background: var(--surface-raised, #16222b); color: var(--muted, #8ea1ae);
    }
    .adv-editor .sc-step.active { border-color: var(--accent, #2588df); color: var(--text, #e6eef4); }
    #scStepHint { min-height: 15px; margin-bottom: 6px; }
    .adv-editor .actions { display: flex; gap: 8px; position: sticky; bottom: 0;
      padding: 8px 0; background: linear-gradient(transparent, var(--surface, #101a22) 30%); }
    #scReport { margin-top: 8px; line-height: 1.6; }
    #scReport ul { margin: 4px 0 4px 18px; padding: 0; }
    #scReport pre { white-space: pre-wrap; font-size: 11px; }
    /* 校验结论三色：旧 #e2725b 在浅底上只有 3.2:1（12px 正文判不可读），改用 ui.css 语义 token */
    .sc-ok { color: var(--ls-ok); }
    .sc-bad { color: var(--ls-err); }
    .sc-warn { color: var(--ls-warn); }
    .adv-frame-wrap { position: relative; flex: 1 1 auto; min-height: 0; }
    iframe#advSimFrame { width: 100%; height: 100%; border: 0; display: block; }
  </style>
</head>
<body>
  <script>
    if (new URLSearchParams(location.search).get("embedded") === "1") {
      document.body.classList.add("embedded");
    }
  </script>
  <!-- 统一顶栏：内容由 shared/topnav.js 渲染（样式在 shared/ui.css）。
       嵌入态（workbench iframe，?embedded=1）由 ui.css 的 body.embedded 规则整体隐藏。 -->
  <header id="lsTopNav"></header>
  <div class="adv-bar">
    <strong>高级仿真</strong>
    <span class="hint" id="scSummary">（尚未生成场景）</span>
    <span class="spacer"></span>
    <button class="adv-btn primary" id="scStartTop" disabled>启动仿真</button>
    <button class="adv-btn" id="advEditorToggle" aria-expanded="false" aria-controls="scEditorPanel">场景编辑器</button>
    <a class="adv-btn" id="advNavMapLink" href="navigation_editor.html?embedded=1" target="_blank" rel="noopener">导航地图编辑器</a>
  </div>

  <div class="adv-body">
    <aside class="adv-editor" id="scEditorPanel" aria-label="场景编辑器">
      <!-- 步骤条由 `scenario_editor.SCENARIO_STEPS` 渲染（唯一真值），这里只给宿主 -->
      <nav class="sc-steps" id="scSteps"></nav>
      <div class="note" id="scStepHint"></div>

      <!-- 场景身份 + 机器人/策略：A 类绑定校验需要"被选策略"，故这里必须能选策略 -->
      <section data-step="identity">
        <h3>场景</h3>
        <label for="scScenarioId">场景 id（小写字母/数字/_/-）</label>
        <input type="text" id="scScenarioId" value="advanced_probe">
        <label for="scRobot">机器人</label>
        <select id="scRobot"></select>
        <label for="scPolicy">策略（A 类场景必须选，否则不校验绑定）</label>
        <select id="scPolicy"></select>
        <div class="row">
          <div>
            <label for="scSeed">随机种子</label>
            <input type="number" id="scSeed" value="0" step="1">
          </div>
          <div>
            <label for="scEpisode">时长 (s)</label>
            <input type="number" id="scEpisode" value="60" min="1" max="600">
          </div>
        </div>
      </section>

      <!-- 地图：地图 id 同时是仿真页的 `terrain`（其 resolveTerrainName 按名解析） -->
      <section data-step="map">
        <h3>地图</h3>
        <label for="scMap">地图库（服务端真值）</label>
        <select id="scMap"></select>
        <label for="scTerrain">地形种类（契约 terrain.kind）</label>
        <select id="scTerrain"></select>
        <label>指令上限 (vx / vy / wz)</label>
        <div class="row">
          <input type="number" id="scLimitVx" value="1" step="0.1" min="0.01">
          <input type="number" id="scLimitVy" value="1" step="0.1" min="0.01">
          <input type="number" id="scLimitWz" value="1" step="0.1" min="0.01">
        </div>
      </section>

      <!-- 传感器：route 是"感知分层"的开关（A 类进策略观测 / B 类在策略外） -->
      <section data-step="sensors">
        <h3>传感器</h3>
        <label for="scRoute">感知分层 perception.route</label>
        <select id="scRoute">
          <option value="external">external（B 类：感知在策略外）</option>
          <option value="obs">obs（A 类：感知进策略观测）</option>
        </select>
        <label class="inline"><input type="checkbox" id="scHeightfield"> 地形高度场 heightfield</label>
        <label class="inline"><input type="checkbox" id="scDepthCamera"> 深度相机 depth_camera</label>
        <div class="row">
          <div>
            <label for="scDepthWidth">宽 px</label>
            <input type="number" id="scDepthWidth" value="106" min="1">
          </div>
          <div>
            <label for="scDepthHeight">高 px</label>
            <input type="number" id="scDepthHeight" value="60" min="1">
          </div>
          <div>
            <label for="scDepthCutoff">截断 m</label>
            <input type="number" id="scDepthCutoff" value="3" step="0.5" min="0.1">
          </div>
        </div>
        <label class="inline"><input type="checkbox" id="scFootContact"> 足端接触 foot_contact</label>
        <label for="scMount">挂载点 mount</label>
        <input type="text" id="scMount" value="base">
        <div class="note" id="scPerceptionItems">（读取观测项目录…）</div>
      </section>

      <!-- 任务：命令来源决定"谁在开"；外部决策必须有航点（契约硬约束） -->
      <section data-step="task">
        <h3>任务</h3>
        <!-- 任务插件（服务端 `registry/task_plugins` 是唯一真值）：选一条 = "这个任务需要
             哪些传感器 / 自动填哪些字段 / 挂哪些判据"，点「一键填入」把服务端算好的场景
             补到下面的表单里。**不在这页里自己编任务清单或传感器需求**。 -->
        <label for="scTaskPlugin">任务插件（服务端注册表）</label>
        <select id="scTaskPlugin"></select>
        <button type="button" class="adv-btn" id="scTaskFill">一键填入</button>
        <div class="note" id="scTaskPluginResult">（未选任务插件）</div>
        <label for="scCommandSource">命令来源 command_source</label>
        <select id="scCommandSource"></select>
        <div id="scWaypointsRow" hidden>
          <label for="scWaypoints">航点（每行一个 <code>x,y</code>）</label>
          <textarea id="scWaypoints" spellcheck="false" placeholder="0,0
2.5,-1"></textarea>
        </div>
      </section>

      <!-- 判据：跑完按什么判合格 / 记什么账 -->
      <section data-step="checks">
        <h3>判据</h3>
        <label>检查项 checks</label>
        <div id="scChecks"></div>
        <label>记录器 recorders</label>
        <div id="scRecorders"></div>
      </section>

      <div class="actions">
        <button class="adv-btn" id="scValidate">校验</button>
        <button class="adv-btn primary" id="scStart" disabled>启动仿真</button>
      </div>
      <div class="note" id="scLastLaunch"></div>
      <div id="scReport"></div>
    </aside>

    <div class="adv-frame-wrap">
      <!-- 默认落在与基础仿真同款、浏览器已验证稳定的 go2 基础速度跟踪策略。
           go2-rlsar-robotlab（go2_rl_sdk_45）桌面验收 pass 但浏览器闭环发散（步态异常），
           浏览器 parity 未定位前不作默认，可在策略下拉手动选用。 -->
      <iframe id="advSimFrame" title="高级仿真"
        src="sim2sim/index.html?embedded=1&surface=advanced&view=advanced&robot=unitree_go2&policy=go2-baseline-164k"></iframe>
    </div>
  </div>

  <!-- 前端 API 调用的唯一实现（UMD：模块经全局 LSApi 取用）。编辑器不再自建 fetch 封装，
       与 web/shared/api.test.mjs 的源码面守卫同一条口径。普通脚本先于模块执行，
       所以下面的 module 里读 `LSApi` 一定有值。 -->
  <script src="shared/api.js"></script>
  <script src="shared/topnav.js"></script>
  <script>window.LSTopNav.render('lsTopNav', 'navmap');</script>
  <script type="module" src="sim2sim/scenario_editor_ui.js"></script>
</body>
</html>
