<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <title>Episode 回放 · 预测 vs 实际</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; padding: 20px; background: #0b1220; color: #e2e8f0;
      font: 13px/1.6 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    h1 { font-size: 16px; margin: 0 0 4px; }
    .hint { color: #94a3b8; margin-bottom: 14px; }
    .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
    select, button {
      background: #1e293b; color: #e2e8f0; border: 1px solid #334155;
      border-radius: 6px; padding: 6px 10px; font: inherit;
    }
    button { cursor: pointer; }
    button:hover { background: #273449; }
    canvas { background: #111a2b; border: 1px solid #24334d; border-radius: 8px; }
    .meta { margin-top: 10px; color: #94a3b8; }
    .warn { color: #fbbf24; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; margin-right: 14px; }
    .swatch { width: 18px; height: 3px; display: inline-block; border-radius: 2px; }
    code { background: #1e293b; padding: 1px 5px; border-radius: 4px; }
  </style>
</head>

<body>
  <h1>Episode 回放 —— 预测 vs 实际</h1>
  <div class="hint">
    数据来自只读接口 <code>GET /api/episode/list</code> 与 <code>GET /api/episode/{run}/{conn}/{episode}</code>。
    两条轨迹共用同一尺度（否则"差 0.6 m"会被画成"完全重合"）。
  </div>

  <div class="bar">
    <select id="episodeSelect"></select>
    <button id="reloadButton">刷新列表</button>
    <button id="loadButton">载入并回放</button>
  </div>

  <canvas id="overlayCanvas" width="520" height="420"></canvas>

  <div class="legend meta">
    <span><i class="swatch" style="background:#f59e0b"></i>预测（模型航点）</span>
    <span><i class="swatch" style="background:#38bdf8"></i>实际（实测位姿）</span>
  </div>
  <div class="meta" id="statusText">正在读取 episode 列表…</div>

  <script type="module">
    import { drawPredictedVsActual } from './sensor_panels.js';

    const select = document.getElementById('episodeSelect');
    const status = document.getElementById('statusText');
    const canvas = document.getElementById('overlayCanvas');

    async function loadListing() {
      try {
        const response = await fetch('/api/episode/list');
        const payload = await response.json();
        if (!payload.success) throw new Error(payload.error || '列表读取失败');
        select.innerHTML = '';
        if (!payload.count) {
          status.textContent = `记录目录 ${payload.root} 下还没有 episode（跑一次导航就会有）。`;
          return;
        }
        for (const item of payload.episodes) {
          const option = document.createElement('option');
          option.value = `${item.run}|${item.conn}|${item.episode}`;
          option.textContent = `${item.run} / ${item.conn} / episode_${String(item.episode).padStart(3, '0')} · ${item.steps} 步`;
          select.appendChild(option);
        }
        status.textContent = `共 ${payload.count} 集。选一集后点「载入并回放」。`;
      } catch (error) {
        status.textContent = `读取列表失败：${error.message}`;
      }
    }

    async function loadEpisode() {
      const value = select.value;
      if (!value) { status.textContent = '还没有可载入的 episode。'; return; }
      const [run, conn, episode] = value.split('|');
      try {
        const response = await fetch(`/api/episode/${encodeURIComponent(run)}/${encodeURIComponent(conn)}/${episode}`);
        if (!response.ok) throw new Error(`接口返回 ${response.status}`);
        const payload = await response.json();
        const overlay = payload.overlay;
        drawPredictedVsActual(canvas.getContext('2d'), {
          predicted: overlay.predicted,
          actual: overlay.actual,
          width: canvas.width,
          height: canvas.height,
          labels: { predicted: '预测', actual: '实际' },
        });
        const notes = [];
        notes.push(`预测 ${overlay.predicted.length} 点 / 实际 ${overlay.actual.length} 点`);
        if (overlay.skipped_steps) notes.push(`解码失败 ${overlay.skipped_steps} 步（已跳过，不补零）`);
        if (payload.truncated_records) notes.push(`末行截断 ${payload.truncated_records} 条（记录不完整）`);
        // 未标定偏移就明说：没标定别假装准
        const offsetNote = overlay.offset_calibrated
          ? `前向偏移 ${overlay.forward_offset} m（已标定）`
          : '前向偏移 <span class="warn">未标定</span> —— 预测与实际可能整体错开约 0.6 m，别当控制误差看';
        status.innerHTML = notes.join(' · ') + ' · ' + offsetNote;
      } catch (error) {
        status.textContent = `载入失败：${error.message}`;
      }
    }

    document.getElementById('reloadButton').addEventListener('click', loadListing);
    document.getElementById('loadButton').addEventListener('click', loadEpisode);
    loadListing();
  </script>
</body>

</html>
