aimrt:
  main_thread:
    name: process_manager
  configurator:
    temp_cfg_path: ../config/process_manager/tmp # 生成的临时模块配置文件存放路径
  log: # log配置
    core_lvl: Info # 内核日志等级，可选项：Trace/Debug/Info/Warn/Error/Fatal/Off，不区分大小写
    default_module_lvl: Info
    backends: # 日志backends
      - type: console # 控制台日志
        options:
          log_executor_name: log_thread
      - type: rotate_file # 文件日志
        options:
          path: ${LOG_PATH} # 日志文件路径
          filename: process_manager.log # 日志文件名称
          max_file_size_m: 50 # 日志文件最大尺寸，单位m
          max_file_num: 200 # 最大日志文件数量，0代表无限
          log_executor_name: log_thread
  plugin:
    plugins:
      - name: ros2_plugin
        path: libaimrt_ros2_plugin.so
        options:
          node_name: ${EM_APP_NAME}
          auto_initialize_logging: false
      - name: viz_plugin
        path: libaimrt_viz_plugin.so
        options:
          executor: default_viz_executor
          node_name: ${EM_APP_NAME}
          soc: ${SOC_NAME}

  executor: # 执行器配置
    executors: # 当前先支持thread型，未来可根据加载的网络模块提供更多类型
      - name: log_thread
        options:
          thread_num: 1
        type: asio_thread
      - name: sm_rpc_worker
        type: asio_thread
        options:
          thread_num: 3
      - name: default_viz_executor
        type: asio_thread

  channel: # 消息队列相关配置

  rpc: # rpc相关配置
    backends: # rpc后端配置
      - type: ros2

    servers_options:
      - func_name: "pb:/${EM_APP_NAME}/GetNodeInfo" # Viz插件获取node info请求
        enable_backends: [ros2]
        enable_filters: [viz]
      - func_name: "(.*)"
        enable_backends: [ros2]
        enable_filters: [viz]

# 模块自定义配置，框架会为每个模块生成临时配置文件，开发者通过Configurator接口获取该配置文件路径
PMModule:
  run_agibot_file: "/agibot/software/v0/entry/bin/cfg/run_agibot.yaml"
  domain_socket_thread_num: 8
  std_safe_log_enable: true
  max_std_safe_log_num: 50
