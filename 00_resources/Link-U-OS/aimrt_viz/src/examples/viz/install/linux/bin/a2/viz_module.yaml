aimrt:
  plugin:
    plugins:
      - name: net_plugin
        path: ./libaimrt_net_plugin.so
        options:
          thread_num: 4
          http_options:
            listen_ip: 0.0.0.0
            listen_port: 50090
      - name: ros2_plugin
        path: ./libaimrt_ros2_plugin.so
        options:
          node_name: example_pb_chn_benchmark_subscriber
          executor_type: MultiThreaded # SingleThreaded/StaticSingleThreaded/MultiThreaded
          executor_thread_num: 2
          auto_initialize_logging: false
      - name: viz_plugin
        path: ./libaimrt_viz_plugin.so
        options:
          executor: default_viz_executor
          node_name: viz_module
          soc: tian_zhun
          service_name: viz_module

  log: # log配置
    core_lvl: INFO # 内核日志等级，可选项：Trace/Debug/Info/Warn/Error/Fatal/Off，不区分大小写
    default_module_lvl: INFO # 模块默认日志等级
    backends: # 日志backends
      - type: console # 控制台日志
        options:
          color: true # 是否彩色打印
      - type: rotate_file
        options:
          path: ${LOG_PATH}
          filename: viz_module_a2_ultra.log

  executor:
    executors:
      - name: work_thread_pool
        type: asio_thread
        options:
          thread_num: 4
      - name: work_executor
        type: asio_thread
        options:
          thread_num: 4
      - name: timeout_handle
        type: time_wheel
        options:
          bind_executor: work_thread_pool
      - name: default_viz_executor
        type: asio_thread
        options:
          thread_num: 4
  rpc:
    backends:
      - type: ros2
        options:
          timeout_executor: timeout_handle
      - type: http

    servers_options:
      - func_name: "(.*)"
        enable_backends: [http]
        # enable_filters: [viz]
    clients_options:
      - func_name: "(.*)"
        enable_backends: [ros2]


  module:
    pkgs:
      - path: ./libviz_pkg.so
        enable_modules: [VizModule]
    modules:
      - name: VizModule
        log_lvl: INFO

# Module custom configuration
VizModule:
  system_name: "VizModule"
  work_executor_name: work_executor
  node_service_list:
    - hal_ethercat
    - hal_lidar
    - hds
    - health_monitor0
    - health_monitor1
    - recordbag0
    - recordbag1
    - tz_camera
  attributes:
    - key: "开发时间"
      value: "2025年5月"
