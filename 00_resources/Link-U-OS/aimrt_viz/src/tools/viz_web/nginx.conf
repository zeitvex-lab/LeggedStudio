server {
    listen 80 default_server;
    listen [::]:80 default_server;
    root /usr/share/nginx/html;
    index index.html;

    # 强制将根路径重定向到/cloud
    location = / {
        return 301 /cloud;
    }
    
    location =/cloud {
        rewrite /cloud /cloud/;
    }

    # RPC代理：动态转发到用户指定的后端端
    location /rpc/ {
        set $backend_host $http_x_backend_host;
        set $backend_port $http_x_backend_port;
        
        if ($backend_port = "") {
            set $backend_port "50080";
        }
        
        if ($backend_host = "") {
            return 400 "Backend host not specified";
        }
        
        proxy_pass http://$backend_host:$backend_port;
        
        # 代理配置
        proxy_set_header Host $backend_host:$backend_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        
        # CORS配置
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
        add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Backend-Host,X-Backend-Port';
        
        # 处理OPTIONS预检请求
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
            add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Backend-Host,X-Backend-Port';
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain; charset=utf-8';
            add_header Content-Length 0;
            return 204;
        }
    }

    location / {
        try_files $uri $uri/ /cloud/index.html;
        if ($request_filename ~ .*\.(htm|html)$) {
            add_header Cache-Control no-store,no-cache;
            add_header Pragma no-cache;
        }
    }
}

