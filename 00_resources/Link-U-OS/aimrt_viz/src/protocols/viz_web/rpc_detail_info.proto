syntax = "proto3";

package aimrt.protocols.viz_web;

message RpcBaseInfo {
  string func_name = 1;
  string request_type = 2;
  string response_type = 3;
  uint32 request_schema_id = 4;
  uint32 response_schema_id = 5;
  repeated string backend_name = 6;
  repeated string filter_name = 7;
}

message RpcModuleStatusInfo {
  string node_name = 1;
  string module_name = 2;
  repeated string backend_name = 3;
  repeated string filter_name = 4;
  float qps = 5;
  float latency_us = 6;
  float error_rate = 7;
}

message RpcCurrentStatusInfo {
  float qps = 1;
  float error_rate = 2;
}

message RpcHistoryStatusInfo {
  uint64 seq_num = 1;
  uint64 error_count = 2;
}

message RpcClientInfo {
  RpcCurrentStatusInfo current_status = 1;
  RpcHistoryStatusInfo history_stats = 2;
  repeated RpcModuleStatusInfo module_infos = 3;
}

message RpcServerInfo {
  RpcCurrentStatusInfo current_status = 1;
  RpcHistoryStatusInfo history_stats = 2;
  repeated RpcModuleStatusInfo module_infos = 3;
}

message RpcEndpointInfo {
  message EndpointInfo {
    string node_name = 1;
    string module_name = 2;
    repeated string filter_name = 3;
  }
  string backend_name = 1;
  repeated EndpointInfo client_endpoints = 2;
  repeated EndpointInfo server_endpoints = 3;
}

message RpcDetailStaticInfoResponse {
  RpcBaseInfo base_info = 1;
}

message RpcDetailDynamicInfoResponse {
  RpcClientInfo client_info = 1;
  RpcServerInfo server_info = 2;
  repeated RpcEndpointInfo endpoint_info = 3;
}

message RpcDetailInfoRequest {
  string func_name = 1;
}

message RpcDetailInfoResponse {
  RpcDetailStaticInfoResponse rpc_detail_static_info = 1;
  RpcDetailDynamicInfoResponse rpc_detail_dynamic_info = 2;
}